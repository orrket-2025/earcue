<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#161617">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<!--APP-START-->
<title>EarCue Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#161617; --block:#222224; --block-2:#2A2A2D; --block-3:#333336;
  --line:rgba(255,255,255,.06); --text:#F4F4F5; --muted:#8B8B92; --dim:#5A5A62;
  --lime:#CDFF6A; --lime-ink:#152000; --lime-soft:rgba(205,255,106,.13); --lime-line:rgba(205,255,106,.35);
  --danger:#FF6B6B; --neon:var(--lime);
  --sans:"Inter","Noto Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"Inter",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:22px; --r2:16px; --gap:10px;
  --led-now:#FF6B6B; --led-next:var(--lime); --led-off:#4A4A50; --lamp:#F4F4F5; --lamp-glow:rgba(205,255,106,.3);
  --text-soft:var(--muted); --text-dim:var(--dim); --well-deep:#1B1B1D; --well:#1F1F21; --edge-light:transparent; --edge-dark:transparent;
}
*{box-sizing:border-box}
html,body{height:100%;overscroll-behavior:none}
body{margin:0;font-family:var(--sans);color:var(--text);font-size:15px;line-height:1.5;background:var(--bg);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;font-variant-numeric:tabular-nums}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--lime);outline-offset:2px;border-radius:8px}
[hidden]{display:none!important}
::selection{background:var(--lime-soft)}
a{color:var(--lime)}

/* shell */
.app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:0 14px env(safe-area-inset-bottom)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(12px + env(safe-area-inset-top)) 2px 10px;min-height:58px}
.topbar .left,.topbar .right{display:flex;align-items:center;gap:8px;min-width:0}
.brand{display:flex;align-items:center;gap:10px;line-height:1;user-select:none}
.brand::before{content:"E";display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:9px;background:var(--lime);color:var(--lime-ink);font-weight:800;font-size:16px}
.brand b{font-weight:600;font-size:16px;letter-spacing:-.01em}
.brand small{display:none}
.hero-brand{padding:26px 4px 12px}
.hero-brand .brand b{font-size:22px}
.hero-brand .version{margin-top:8px;font-size:11px;color:var(--dim)}
.eyebrow{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);font-weight:600}
h1,h2,h3{margin:0;font-weight:600}
h2{font-size:13px;color:var(--muted);letter-spacing:.02em;font-weight:500;padding:0 4px}
p{margin:0}
.muted{color:var(--muted)} .dim{color:var(--dim)} .mono{font-family:var(--mono)}

/* primitives: blocks */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 18px;height:52px;border-radius:var(--r2);font-weight:500;font-size:15px;color:var(--text);background:var(--block-2);transition:background .12s,transform .08s,opacity .12s;user-select:none;touch-action:manipulation;white-space:nowrap}
.btn:hover{background:var(--block-3)}
.btn:active,.btn.is-down{transform:scale(.985);background:var(--block-3)}
.btn.lamp{background:var(--lime);color:var(--lime-ink);font-weight:600}
.btn.lamp:hover{background:#D8FF85}
.btn.small{height:40px;padding:0 14px;font-size:13.5px;border-radius:13px}
.btn.icon{width:44px;height:44px;padding:0;border-radius:14px}
.btn.icon.small{width:36px;height:36px}
.btn.ghost{background:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--block);color:var(--text)}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.35;cursor:default;transform:none}
.btn svg{width:18px;height:18px;fill:currentColor;flex:none}
.btn.rec-on{background:var(--danger);color:#fff}
.panel{border-radius:var(--r);padding:16px;background:var(--block)}
.well{border-radius:var(--r2);background:var(--block)}
.field{width:100%;padding:13px 16px;border:0;border-radius:var(--r2);background:var(--block);color:var(--text);resize:none;line-height:1.55}
.field::placeholder{color:var(--dim)}
.field:focus{outline:0;box-shadow:0 0 0 2px var(--lime-line)}
select.field{appearance:none;padding-right:38px}
.select-wrap{position:relative}
.select-wrap::after{content:"";position:absolute;right:16px;top:50%;width:7px;height:7px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:translateY(-70%) rotate(45deg);pointer-events:none}

/* leds + keycaps */
.led{width:8px;height:8px;border-radius:50%;background:var(--led-off);flex:none}
.led.now{background:var(--led-now);box-shadow:0 0 8px rgba(255,107,107,.6)}
.led.next,.led.lamp{background:var(--lime);box-shadow:0 0 8px var(--lamp-glow)}
.led.stale{background:#FFC857;box-shadow:0 0 8px rgba(255,200,87,.6)}
.led.blink{animation:blink .9s steps(2,start) infinite}
.led.tiny{width:6px;height:6px;display:inline-block;margin-left:4px;vertical-align:middle}
@keyframes blink{to{visibility:hidden}}
.key{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:24px;padding:0 8px;border-radius:7px;font:500 11.5px/1 var(--mono);color:var(--text);background:var(--block-3);vertical-align:middle}
.key.lit{background:var(--lime);color:var(--lime-ink)}
.key.x{padding:0;min-width:22px;height:22px;color:var(--muted)}

/* toggles as blocks */
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;padding:12px 0;border-top:1px solid var(--line)}
.switch:first-child{border-top:0}
.switch .label{display:flex;flex-direction:column;gap:2px;min-width:0}
.switch .label span{font-size:15px;font-weight:500}
.switch .label small{font-size:12.5px;color:var(--muted)}
.rocker{position:relative;flex:none;width:50px;height:30px;border-radius:15px;background:var(--block-3);transition:background .16s}
.rocker::before{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#8B8B92;transition:transform .16s,background .16s}
.switch[aria-checked="true"] .rocker{background:var(--lime)}
.switch[aria-checked="true"] .rocker::before{transform:translateX(20px);background:var(--lime-ink)}
/* bento tile toggle */
.tile{position:relative;display:flex;flex-direction:column;justify-content:space-between;text-align:left;min-height:104px;padding:14px 16px;border-radius:var(--r);background:var(--block);transition:background .15s}
.tile .t{font-size:13.5px;color:var(--muted);font-weight:500}
.tile .v{font-size:30px;font-weight:600;letter-spacing:-.02em;color:var(--dim);align-self:flex-end;line-height:1}
.tile[aria-checked="true"]{background:var(--lime-soft);box-shadow:inset 0 0 0 1px var(--lime-line)}
.tile[aria-checked="true"] .t{color:var(--lime)}
.tile[aria-checked="true"] .v{color:var(--lime)}
.tile.wide{grid-column:1 / -1}

/* progress track */
.track{position:relative;height:6px;border-radius:3px;background:var(--block-3)}
.track .fill{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--lime);width:0;transition:width .12s linear}
.track .thumb{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:var(--lime);left:0;transition:left .12s linear}

/* views */
.view{flex:1;display:flex;flex-direction:column;gap:var(--gap);padding-bottom:28px}
.stack{display:flex;flex-direction:column;gap:var(--gap)}
.row{display:flex;align-items:center;gap:var(--gap)}
.row.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap)}

/* home */
.script-list{display:flex;flex-direction:column;gap:var(--gap)}
.script-card{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:16px 18px;border-radius:var(--r);background:var(--block);transition:background .12s}
.script-card:hover{background:var(--block-2)}
.script-card .title{font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.script-card .meta{font-size:12.5px;color:var(--muted);margin-top:3px}
.script-card .go{color:var(--dim);flex:none}
.empty{padding:26px 16px;text-align:center;color:var(--muted);font-size:14px;line-height:1.7;border-radius:var(--r);background:var(--block)}
.drop{position:relative;border-radius:var(--r);padding:22px 16px;text-align:center;background:var(--block);color:var(--muted);font-size:14px;line-height:1.7;border:1.5px dashed var(--block-3);transition:border-color .12s}
.drop.over{border-color:var(--lime)}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.drop strong{display:block;color:var(--text);font-weight:600;font-size:15.5px}
.drop .formats{font-size:11px;letter-spacing:.08em;color:var(--dim);margin-top:6px}

/* editor */
.title-input{font-size:19px;font-weight:600;padding:14px 16px}
.sent-list{display:flex;flex-direction:column;gap:8px}
.sent{position:relative;display:grid;grid-template-columns:30px 1fr;gap:0 8px;padding:10px 12px 10px 8px;border-radius:var(--r2);background:var(--block);transition:box-shadow .12s}
.sent.focus{box-shadow:0 0 0 2px var(--lime-line)}
.sent .num{font-size:11px;color:var(--dim);text-align:right;padding-top:9px}
.sent textarea{grid-column:2;width:100%;border:0;background:none;padding:6px 4px;line-height:1.6;resize:none;overflow:hidden;color:var(--text);min-height:36px}
.sent textarea:focus{outline:0}
.sent .tools{grid-column:2;display:none;flex-wrap:wrap;gap:6px;padding:6px 0 2px}
.sent.focus .tools{display:flex}
.sent .len{font-size:11px;color:var(--dim);margin-left:auto;align-self:center}
.hint{font-size:12.5px;color:var(--dim);line-height:1.6;padding:0 4px}
.hint.center{text-align:center;padding:10px 6px 0}
.warn-text{color:var(--danger)}
.plain-link{color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.rec-entry{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:16px 18px;border-radius:var(--r);background:var(--block);color:var(--text)}
.rec-entry:hover{background:var(--block-2)}
.rec-entry .t{display:block;font-weight:600;font-size:15px}
.rec-entry small{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.rec-entry svg{width:20px;height:20px;fill:var(--muted);flex:none}
.rec-count{font-size:12px;color:var(--muted);white-space:nowrap}
.rec-count b{color:var(--text);font-weight:600}

/* stage */
.stage{gap:var(--gap);padding-bottom:calc(14px + env(safe-area-inset-bottom))}
.stage.swipe-mode{touch-action:none;overscroll-behavior:none}
.stage-head{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted);padding:2px 6px 2px}
.stage-head .counter{font-size:22px;color:var(--text);font-weight:600;letter-spacing:-.02em}
.stage-head .counter small{font-size:13px;color:var(--dim);margin-left:4px;font-weight:500}
.lyrics{position:relative;height:min(46vh,420px);border-radius:var(--r);overflow:hidden;background:var(--block);transition:box-shadow .25s}
.lyrics.speaking{box-shadow:inset 0 0 0 1.5px var(--lime-line)}
.ly-list{position:absolute;inset:0;padding:0 18px 64px;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;-webkit-mask-image:linear-gradient(180deg,transparent 0,#000 8%,#000 76%,transparent 88%);mask-image:linear-gradient(180deg,transparent 0,#000 8%,#000 76%,transparent 88%)}
.ly-list::-webkit-scrollbar{display:none}
.ly-pad{height:42%}
.ly{display:grid;grid-template-columns:24px 1fr;gap:0 8px;align-items:baseline;padding:8px 0;transition:color .3s ease}
.ly .n{font-size:11px;color:var(--dim);text-align:right}
.ly .text{font-size:var(--script-size,18px);line-height:1.55;color:var(--muted);word-break:keep-all;overflow-wrap:anywhere;transition:color .3s ease}
.ly.before .text{color:var(--dim)}
.ly.now .n{color:var(--lime)}
.ly.now .text{color:var(--lime);font-weight:600}
.ly.now .text .said{color:#fff}
.ly-foot{position:absolute;left:0;right:0;bottom:0;padding:16px 18px 14px;background:linear-gradient(180deg,rgba(34,34,36,0),rgba(34,34,36,.97) 45%)}
.ly-foot .tag{display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;font-weight:600}
.ly-foot .tag .n{margin-left:auto;color:var(--dim);letter-spacing:0}
.status{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--dim);min-height:20px;padding:0 6px}
.status .chip{display:inline-flex;align-items:center;gap:6px}
.status .chip.on{color:var(--text)}
.status .chip.warn{color:var(--danger)}
.transport{display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:var(--gap)}
.transport .btn{height:60px;border-radius:var(--r);font-size:15.5px}
.transport .btn svg{width:20px;height:20px}
.deck{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap)}
.speed{grid-column:1 / -1;padding:14px 18px 16px;border-radius:var(--r);background:var(--block);display:flex;flex-direction:column;gap:6px}
.speed .top{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-weight:500}
.speed .val{font-size:56px;font-weight:600;letter-spacing:-.03em;text-align:center;line-height:1.05;margin:4px 0}
.speed .val small{font-size:22px;color:var(--muted);margin-left:2px;font-weight:500}
.range{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;margin:0}
.range::-webkit-slider-runnable-track{height:3px;border-radius:2px;background:linear-gradient(90deg,var(--lime) var(--pct,30%),var(--block-3) var(--pct,30%))}
.range::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--lime);margin-top:-9.5px;box-shadow:0 0 0 4px var(--bg)}
.range::-moz-range-track{height:3px;border-radius:2px;background:var(--block-3)}
.range::-moz-range-progress{height:3px;background:var(--lime)}
.range::-moz-range-thumb{width:22px;height:22px;border:0;border-radius:50%;background:var(--lime)}
.speed .ticks{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);padding:0 4px}
.remote-line{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--dim);padding:6px 4px 0;line-height:2.2}
.remote-line .key{min-width:24px;height:22px;padding:0 6px;font-size:11px}
body.swipe-lock{overflow:hidden;height:100dvh;touch-action:none;overscroll-behavior:none}
html:has(body.swipe-lock){overflow:hidden;touch-action:none}
body.swipe-lock .app{height:100dvh;overflow:hidden}
body.swipe-lock .lyrics{height:max(260px,calc(100dvh - 470px))}
body.swipe-lock .ly-list{touch-action:none}
body.swipe-lock .remote-line{display:none}
body.swipe-lock .speed .val{font-size:40px}
body.swipe-lock .tile{min-height:84px}

/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);opacity:0;transition:opacity .2s;z-index:20}
.sheet-bg.open{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;margin:0 auto;max-width:520px;border-radius:26px 26px 0 0;padding:12px 16px calc(24px + env(safe-area-inset-bottom));z-index:21;background:var(--block);transform:translateY(102%);transition:transform .26s cubic-bezier(.2,.8,.2,1)}
.sheet.open{transform:none}
.sheet .grip{width:40px;height:4px;border-radius:2px;margin:0 auto 14px;background:var(--block-3)}
.sheet h2{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin:18px 0 8px;font-weight:600}
.sheet h2:first-of-type{margin-top:4px}
.sheet .field,.sheet .well,.sheet .seg,.sheet .sig-mon{background:var(--bg)}
.setting{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0}
.setting .label{display:flex;flex-direction:column;gap:2px}
.setting .label small{font-size:12.5px;color:var(--muted)}
.stepper{display:flex;align-items:center;gap:6px}
.stepper .btn{width:36px;height:36px;padding:0;font-size:18px;border-radius:11px;background:var(--block-3)}
.stepper .val{min-width:54px;text-align:center;font-size:15px;font-weight:600}
.keymap-row{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.keymap-row:first-of-type{border-top:0}
.keymap-row .keys{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:28px}
.keymap-row .keys .k{display:inline-flex;align-items:stretch;border-radius:7px;background:var(--block-3);overflow:hidden}
.keymap-row .keys .k .key{background:none;border-radius:0}
.keymap-row .keys .k button{width:22px;height:24px;font-size:13px;color:var(--muted);border-left:1px solid var(--line)}
.keymap-row .empty-keys{font-size:12px;color:var(--dim)}
.learn-note{font-size:12px;color:var(--lime);animation:blink 1s steps(2,start) infinite}
.sig-mon{display:flex;flex-direction:column;gap:6px;padding:10px 12px;border-radius:var(--r2);background:var(--bg);font-size:11.5px}
.sig-mon .sig{display:flex;align-items:center;gap:10px}
.diag-list{margin:0;padding:12px 14px;border-radius:var(--r2);background:var(--block);font:12px/1.7 var(--mono);color:var(--text);white-space:pre-wrap;word-break:break-all;min-height:50vh;max-height:66vh;overflow:auto}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:0;background:transparent}
.seg button{display:flex;align-items:center;justify-content:center;gap:8px;height:46px;border-radius:var(--r2);font-size:14px;color:var(--muted);background:var(--block-2)}
.seg button svg{width:16px;height:16px;fill:currentColor}
.seg button[aria-checked="true"]{color:var(--lime);background:var(--lime-soft);box-shadow:inset 0 0 0 1px var(--lime-line)}
.seg.mini{grid-template-columns:repeat(3,44px)}
.seg.presets button{flex-direction:column;align-items:flex-start;height:auto;padding:12px 14px;text-align:left;gap:3px}
.seg.presets button b{font-weight:600;font-size:14px;color:var(--text)}
.seg.presets button small{font-size:11.5px;color:var(--muted);line-height:1.4}
.seg.presets button[aria-checked="true"] b{color:var(--lime)}
.ai-summary{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.ai-summary b{color:var(--text);font-weight:600;margin-right:3px}
.panel .t{font-weight:600;font-size:15px}
.panel small.muted{display:block;font-size:12.5px;margin-top:2px}
.wiz-title{font-size:28px;font-weight:600;margin-top:4px;letter-spacing:-.02em}
.wiz-desc{font-size:15.5px;color:var(--muted);line-height:1.6}
.wiz-wait{display:flex;align-items:center;gap:10px;padding:18px 0}
.wiz-row{padding:8px 0;border-top:1px solid var(--line)}
.wiz-row:first-child{border-top:0}
.wiz-row.cur{color:var(--lime)}
.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom));transform:translate(-50%,20px);padding:11px 18px;border-radius:14px;background:var(--lime);color:var(--lime-ink);font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.22s;z-index:30;max-width:calc(100% - 36px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.done-card{padding:28px 18px;text-align:center;border-radius:var(--r);background:var(--block)}
.done-card .big{font-size:22px;color:var(--text);font-weight:600;margin-bottom:8px}
.center-row{justify-content:center;margin-top:4px}
.switches.bottom{margin-top:auto;padding-top:14px}
/* sliders in voice screen */
.slider-row{display:grid;grid-template-columns:72px 1fr 44px;align-items:center;gap:10px;padding:6px 0}
.slider-row .l{font-size:13px;color:var(--muted)}
.slider-row .v{font-size:13px;text-align:right;color:var(--text);font-weight:600}

/* ---------------- sample script ---------------- */
const SAMPLE_TITLE = '샘플 · 분기 제품 발표';
const SAMPLE_TEXT = `안녕하세요. 오늘 3분기 제품 로드맵을 발표하게 된 제품팀의 김지수입니다.
오늘 발표는 세 부분으로 나뉩니다. 먼저 지난 분기 성과를 짧게 돌아보고, 다음으로 새 기능 세 가지를 소개한 뒤, 마지막으로 출시 일정을 공유하겠습니다.

지난 분기 월간 활성 사용자는 42만 명으로, 전 분기 대비 18% 성장했습니다. 특히 모바일 앱의 재방문율이 눈에 띄게 올랐습니다.

이제 새 기능을 말씀드리겠습니다. 첫 번째는 오프라인 모드입니다. 인터넷이 끊겨도 마지막으로 열었던 문서를 그대로 보고 편집할 수 있습니다.

출시 일정입니다. 오프라인 모드는 다음 달 첫째 주에 베타로 열고, 팀 공유 폴더는 그 다음 달에 정식 출시합니다. 음성 메모는 연말까지 마무리하겠습니다.

/* ---------------- storage ---------------- */

  next: ['PageDown', 'ArrowRight', 'ArrowDown', ' ', 'Media:next', 'Swipe↑'],
  prev: ['PageUp', 'ArrowLeft', 'ArrowUp', 'Media:prev', 'Swipe↓'],
  play: ['F5', '.', 'Enter', 'b', 'Media:play', 'Tap'],
};
const DEFAULT_SETTINGS = { rate: 1.3, voiceURI: '', auto: false, lead: 2, listen: false, keymap: DEFAULT_KEYMAP, voiceSource: 'mine', recAdvance: true, fontSize: 18, elVoiceId: '', elVoiceName: '', elProfile: 'jobs', elStyle: { speed: 0.92, pause: 0.6, style: 0.25, stability: 0.6 }, elKeepRec: true, polish: false };

const store = {
  load(k, d) { try { const v = localStorage.getItem('earcuelab.' + k); return v ? JSON.parse(v) : d; } catch { return d; } },
  save(k, v) { try { localStorage.setItem('earcuelab.' + k, JSON.stringify(v)); } catch { toast('저장 공간이 부족합니다'); } },
};
let scripts = store.load('scripts', []);
let settings = Object.assign({}, DEFAULT_SETTINGS, store.load('settings', {}));
settings.keymap = Object.assign({}, DEFAULT_KEYMAP, settings.keymap || {});
const saveScripts = () => store.save('scripts', scripts);
const saveSettings = () => store.save('settings', settings);

/* ---------------- sentence splitting ---------------- */
const TERM = '.!?。！？';
const CLOSERS = '"\'”’」』)]』】';
function splitLine(t) {
  const res = []; let start = 0;
  for (let i = 0; i < t.length; i++) {
    if (!TERM.includes(t[i])) continue;
    let j = i;
    while (j + 1 < t.length && TERM.includes(t[j + 1])) j++;
    while (j + 1 < t.length && CLOSERS.includes(t[j + 1])) j++;
    if (j + 1 >= t.length || /\s/.test(t[j + 1])) {
      const piece = t.slice(start, j + 1).trim();
      if (piece) res.push(piece);
      start = j + 1; i = j;
    }
  }
  const rest = t.slice(start).trim();
  if (rest) res.push(rest);
  return res;
}
function splitSentences(text) {
  return String(text).replace(/\r/g, '').split(/\n+/).flatMap((l) => splitLine(l.trim()));
}
const mkSentences = (arr) => arr.map((text) => ({ id: uid(), text }));

/* ---------------- my-voice recordings (IndexedDB) ---------------- */
const idb = {
  db: null,
  open() {
    if (this.db) return Promise.resolve(this.db);
    return new Promise((res, rej) => {
      if (!window.indexedDB) return rej(new Error('no-idb'));
      const req = indexedDB.open('earcuelab', 1);
      req.onupgradeneeded = () => { const db = req.result; if (!db.objectStoreNames.contains('recordings')) db.createObjectStore('recordings', { keyPath: 'id' }).createIndex('scriptId', 'scriptId'); };
      req.onsuccess = () => { this.db = req.result; res(this.db); };
      req.onerror = () => rej(req.error);
    });
  },
  async write(fn) { const db = await this.open(); return new Promise((res, rej) => { const t = db.transaction('recordings', 'readwrite'); fn(t.objectStore('recordings')); t.oncomplete = () => res(); t.onerror = () => rej(t.error); }); },
  put(rec) { return this.write((st) => st.put(rec)); },
  del(id) { return this.write((st) => st.delete(id)); },
  async byScript(scriptId) { const db = await this.open(); return new Promise((res, rej) => { const req = db.transaction('recordings').objectStore('recordings').index('scriptId').getAll(scriptId); req.onsuccess = () => res(req.result || []); req.onerror = () => rej(req.error); }); },
};
const recs = new Map(); // sentenceId -> { id, scriptId, blob, duration(ms), mime, url? }
async function loadRecs(scriptId) {
  recs.forEach((r) => r.url && URL.revokeObjectURL(r.url)); recs.clear();
  try { for (const r of await idb.byScript(scriptId)) recs.set(r.id, r); } catch {}
}
const recUrl = (r) => r.url || (r.url = URL.createObjectURL(r.blob));
const fmtSec = (ms) => (ms / 1000).toFixed(1) + 's';
function syncRecCount(script) { script.recCount = script.sentences.filter((x) => recs.has(x.id)).length; saveScripts(); }
async function saveRec(script, sentenceId, take, extra = {}) {
  const r = { id: sentenceId, scriptId: script.id, blob: take.blob, duration: take.duration, mime: take.mime, createdAt: Date.now(), kind: 'rec', ...extra };
  try { await idb.put(r); } catch { toast('녹음을 저장할 수 없습니다 (저장 공간 확인)'); return false; }
  const old = recs.get(sentenceId); if (old && old.url) URL.revokeObjectURL(old.url);
  recs.set(sentenceId, r); syncRecCount(script); return true;
}
async function removeRec(script, id) { const r = recs.get(id); if (!r) return; if (r.url) URL.revokeObjectURL(r.url); recs.delete(id); try { await idb.del(id); } catch {} syncRecCount(script); }
async function removeAllRecs(scriptId) { try { for (const r of await idb.byScript(scriptId)) await idb.del(r.id); } catch {} recs.clear(); }

const recPlayer = {
  audio: null, raf: 0, playing: false, t0: 0,
  play(rec, { onStart, onProgress, onEnd } = {}) {
    this.stop();
    const a = new Audio(recUrl(rec));
    a.preservesPitch = true; a.mozPreservesPitch = true;
    a.playbackRate = clamp(settings.rate, 0.5, 5);
    let finished = false;
    const finish = (cancelled) => { if (finished) return; finished = true; cancelAnimationFrame(this.raf); this.playing = false; this.audio = null; onEnd && onEnd({ cancelled, dur: performance.now() - this.t0, rate: a.playbackRate }); };
    a.onplaying = () => {
      if (this.playing) return; this.playing = true; this.t0 = performance.now(); onStart && onStart();
      const tick = () => { if (!this.playing) return; onProgress && onProgress(clamp((a.currentTime * 1000) / rec.duration, 0, 1)); this.raf = requestAnimationFrame(tick); };
      this.raf = requestAnimationFrame(tick);
    };
    a.onended = () => finish(false);
    a.onerror = () => { toast('녹음을 재생할 수 없습니다'); finish(true); };
    this.audio = a; this.t0 = performance.now();
    a.play().catch(() => { toast('화면을 한 번 터치한 뒤 다시 눌러 주세요'); finish(true); });
  },
  stop() { cancelAnimationFrame(this.raf); const a = this.audio; if (a) { a.onended = null; a.onerror = null; a.pause(); a.removeAttribute('src'); } this.audio = null; this.playing = false; },
};

const recorder = {
  stream: null, mr: null, chunks: [], t0: 0, ctx: null, analyser: null, raf: 0, onLevel: null,
  get active() { return !!(this.mr && this.mr.state === 'recording'); },
  async prepare() {
    if (this.stream) return true;
    if (!navigator.mediaDevices || !window.MediaRecorder) { toast('이 브라우저는 녹음을 지원하지 않습니다'); return false; }
    try { this.stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } }); }
    catch { toast('마이크 사용이 허용되지 않았습니다'); return false; }
    try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); this.analyser = this.ctx.createAnalyser(); this.analyser.fftSize = 512; this.ctx.createMediaStreamSource(this.stream).connect(this.analyser); } catch {}
    return true;
  },
  mime() { return ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg;codecs=opus', 'audio/aac'].find((m) => MediaRecorder.isTypeSupported(m)) || ''; },
  async start() {
    if (!(await this.prepare())) return false;
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
    this.chunks = []; const m = this.mime();
    try { this.mr = new MediaRecorder(this.stream, m ? { mimeType: m, audioBitsPerSecond: 48000 } : undefined); } catch { toast('녹음을 시작할 수 없습니다'); return false; }
    this.mr.ondataavailable = (e) => { if (e.data && e.data.size) this.chunks.push(e.data); };
    this.mr.start(); this.t0 = performance.now(); this.meter(); return true;
  },
  stop() {
    return new Promise((res) => {
      const mr = this.mr; cancelAnimationFrame(this.raf);
      if (!mr || mr.state === 'inactive') { this.mr = null; return res(null); }
      mr.onstop = () => { const duration = performance.now() - this.t0; const blob = new Blob(this.chunks, { type: mr.mimeType || 'audio/webm' }); this.mr = null; res(duration > 300 ? { blob, duration, mime: blob.type } : null); };
      mr.stop();
    });
  },
  meter() {
    if (!this.analyser) return; const buf = new Uint8Array(this.analyser.fftSize);
    const tick = () => { if (!this.active) return; this.analyser.getByteTimeDomainData(buf); let sum = 0; for (let i = 0; i < buf.length; i++) { const v = (buf[i] - 128) / 128; sum += v * v; } this.onLevel && this.onLevel(Math.min(1, Math.sqrt(sum / buf.length) * 3.2)); this.raf = requestAnimationFrame(tick); };
    this.raf = requestAnimationFrame(tick);
  },
  release() { cancelAnimationFrame(this.raf); if (this.active) { try { this.mr.stop(); } catch {} } this.mr = null; if (this.stream) this.stream.getTracks().forEach((t) => t.stop()); this.stream = null; if (this.ctx) { this.ctx.close().catch(() => {}); this.ctx = null; this.analyser = null; } },
};

/* ---------------- ElevenLabs: cloned voice + generated sentences ----------------
   The API key is typed by the user into the app and kept in this browser only; every call goes straight to
   api.elevenlabs.io from the device. Generated clips are stored beside the presenter's own recordings. */
/* Delivery profiles distilled from well-known speaking styles. Four axes drive the voice:
   speed (ElevenLabs 0.7–1.2), pause (seconds inserted at commas), style (expressiveness 0–1), stability (0–1). */
const PROFILES = {
  jobs:     { label: '잡스 · 제품 발표', desc: '느린 템포, 긴 침묵으로 기대감, 짧은 문장에 힘', analysis: '문장 사이 1초 안팎의 침묵을 두고, 핵심 단어 앞에서 속도를 늦추며, 감정 기복은 작게 유지합니다.', v: { speed: 0.9, pause: 0.9, style: 0.2, stability: 0.65 } },
  ted:      { label: 'TED 강연',      desc: '자연스러운 대화 톤, 또렷한 리듬',              analysis: '보통 속도에 짧은 쉼, 적당한 표현력으로 이야기하듯 이어갑니다.', v: { speed: 1.0, pause: 0.4, style: 0.35, stability: 0.5 } },
  obama:    { label: '오바마 · 연설',  desc: '신중한 템포, 구절마다 쉼, 낮고 안정된 강조',   analysis: '구절 단위로 쉬어 가며 리듬을 만들고, 목소리는 안정적으로 유지하면서 강조는 분명하게 줍니다.', v: { speed: 0.93, pause: 0.7, style: 0.45, stability: 0.55 } },
  energy:   { label: '동기부여 · 열정', desc: '빠르고 힘 있게, 표현력 최대',                analysis: '속도를 올리고 쉼을 줄여 몰아치며, 표현력을 크게 열어 감정을 싣습니다.', v: { speed: 1.08, pause: 0.25, style: 0.65, stability: 0.3 } },
};
const styleOf = () => Object.assign({ speed: 1, pause: 0.4, style: 0.3, stability: 0.5 }, settings.elStyle || {});
const styleKey = (st) => [st.speed, st.pause, st.style, st.stability].map((x) => Number(x).toFixed(2)).join('|');
/* pauses become real breaks inside the sentence; ElevenLabs reads <break time="0.8s" /> as silence */
function withPauses(text, pause) {
  if (!pause || pause < 0.15) return text;
  const t = (pause).toFixed(1) + 's';
  return text.replace(/([,，、])\s*/g, `$1 <break time="${t}" /> `).replace(/([:：;；])\s*/g, `$1 <break time="${t}" /> `);
}
const textHash = (t) => { let h = 5381; const n = normalize(t); for (let i = 0; i < n.length; i++) h = ((h << 5) + h + n.charCodeAt(i)) | 0; return String(h); };
const extOf = (mime) => /mp4|aac/.test(mime) ? 'm4a' : /ogg/.test(mime) ? 'ogg' : /wav/.test(mime) ? 'wav' : /mpeg/.test(mime) ? 'mp3' : 'webm';
const eleven = {
  base: 'https://api.elevenlabs.io/v1', model: 'eleven_multilingual_v2',
  key() { return store.load('eleven', {}).key || ''; },
  setKey(k) { store.save('eleven', { key: String(k || '').trim() }); },
  async req(path, opt = {}) {
    const k = this.key(); if (!k) throw new Error('ElevenLabs API 키를 먼저 입력하세요');
    let res;
    try { res = await fetch(this.base + path, { ...opt, headers: { 'xi-api-key': k, ...(opt.headers || {}) } }); }
    catch { throw new Error('ElevenLabs에 연결할 수 없습니다. 인터넷 연결을 확인하세요'); }
    if (!res.ok) {
      let msg = `오류 ${res.status}`, code = '';
      try { const j = await res.json(); const d = j.detail; code = (d && d.status) || ''; msg = (d && (d.message || (typeof d === 'string' ? d : d.status))) || msg; } catch {}
      if (/missing_permissions|permission/i.test(code + ' ' + msg)) {
        const need = /voice/i.test(path) ? 'Voices: Read and write' : /text-to-speech/i.test(path) ? 'Text to Speech: Access' : 'User: Read';
        msg = `API 키에 권한이 없습니다. ElevenLabs → API Keys에서 이 키를 편집해 "${need}" 권한을 켜 주세요`;
      } else if (res.status === 401 && !code) msg = 'API 키가 올바르지 않습니다';
      else if (code) msg = `${msg} (${code})`;
      throw new Error(msg);
    }
    return res;
  },
  subscription() { return this.req('/user/subscription').then((r) => r.json()); },
  voices() { return this.req('/voices').then((r) => r.json()).then((j) => j.voices || []); },
  clone(name, blobs) {
    const fd = new FormData();
    fd.append('name', name); fd.append('remove_background_noise', 'true');
    fd.append('description', 'EarCue 발표자 목소리'); fd.append('labels', JSON.stringify({ language: 'ko', use_case: 'presentation' }));
    blobs.forEach((b, i) => fd.append('files', b, `sample-${i + 1}.${extOf(b.type)}`));
    return this.req('/voices/add', { method: 'POST', body: fd }).then((r) => r.json());
  },
  async speak(voiceId, text, st, ctx = {}) {

function addScript(title, text) {
  const sentences = mkSentences(splitSentences(text));
  if (!sentences.length) { toast('문장을 찾지 못했습니다'); return; }
  const s = { id: uid(), title: title.trim() || '제목 없음', sentences, createdAt: Date.now(), updatedAt: Date.now() };
  scripts.push(s); saveScripts();
  toast(`${sentences.length}개 문장으로 나눴습니다`);
  go('/edit/' + s.id);
  if (settings.polish && claude.key()) polishScript(s);
}

async function importFile(f) {
  const name = f.name.replace(/\.[^.]+$/, '');
  if (/\.docx$/i.test(f.name)) {
    try {
      if (!window.mammoth) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.8.0/mammoth.browser.min.js');
      const res = await window.mammoth.extractRawText({ arrayBuffer: await f.arrayBuffer() });
      addScript(name, res.value);
    } catch { toast('DOCX를 읽으려면 인터넷 연결이 필요합니다. TXT로 저장해서 올려 주세요.'); }
    return;
  }
  addScript(name, await f.text());
}
function loadScript(src) { return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); }

        <button class="btn danger ghost small" id="del">이 대본 삭제</button>
        <button class="btn lamp" id="toStage2">${ICON.ear}발표 시작</button>
      </div>
    </main>`;
  $('#back').onclick = () => go('/');
  $('#toStage').onclick = $('#toStage2').onclick = () => { state.idx = 0; go('/stage/' + s.id); };
  $('#toVoice').onclick = () => go('/voice/' + s.id);
  const ro = $('#restoreOrig'); if (ro) ro.onclick = async () => { if (!confirm('AI가 다듬기 전 원본 대본으로 되돌릴까요? 생성한 음성은 지워집니다.')) return; await removeAllRecs(s.id); s.sentences = mkSentences(s.original); delete s.original; s.polished = false; s.recCount = 0; touch(); renderEditor(); };
  $('#title').oninput = (e) => { s.title = e.target.value; touch(); };
  $('#add').onclick = () => { s.sentences.push({ id: uid(), text: '' }); touch(); renderList(); focusSentence(s.sentences.length - 1); };
  $('#resplit').onclick = async () => { if (!confirm('모든 문장을 합친 뒤 자동으로 다시 나눕니다. 직접 수정한 구분과 녹음은 모두 사라집니다. 계속할까요?')) return; await removeAllRecs(s.id); s.sentences = mkSentences(splitSentences(s.sentences.map((x) => x.text).join('\n'))); s.recCount = 0; touch(); renderList(); };
  $('#del').onclick = async () => { if (!confirm(`"${s.title}" 대본과 녹음을 삭제할까요?`)) return; await removeAllRecs(s.id); scripts = scripts.filter((x) => x.id !== s.id); saveScripts(); go('/'); };
  renderList();

  function touch() { s.updatedAt = Date.now(); saveScripts(); const c = $('#count'); if (c) c.textContent = s.sentences.length; }
  function renderList() {
    const list = $('#list');
    list.innerHTML = s.sentences.map((x, i) => `
      <div class="sent" data-i="${i}">
        <div class="num">${String(i + 1).padStart(2, '0')}${ledFor(x)}</div>

        <div class="tools">
          <button class="btn small" data-act="say">${ICON.speaker}듣기</button>
          <button class="btn small" data-act="split">${ICON.split}커서에서 나누기</button>
          <button class="btn small" data-act="merge" ${i === s.sentences.length - 1 ? 'disabled' : ''}>${ICON.merge}다음과 합치기</button>
          <button class="btn small ghost danger" data-act="del">${ICON.trash}</button>
          <span class="len"><span>${x.text.length}</span>자</span>
        </div>
      </div>`).join('');
    list.querySelectorAll('textarea').forEach(autosize);
  }
  function autosize(ta) { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px'; }
  function focusSentence(i, pos) {
    const ta = $(`.sent[data-i="${i}"] textarea`); if (!ta) return;
    ta.focus(); if (pos != null) ta.setSelectionRange(pos, pos);
  }
  const list = $('#list');
  const markFocus = (e) => { const card = e.target.closest('.sent'); if (!card) return; list.querySelectorAll('.sent.focus').forEach((c) => c.classList.remove('focus')); card.classList.add('focus'); };
  list.addEventListener('focusin', markFocus);

  list.addEventListener('input', (e) => { if (e.target.tagName !== 'TEXTAREA') return; const card = e.target.closest('.sent'); const i = +card.dataset.i; s.sentences[i].text = e.target.value; card.querySelector('.len span').textContent = e.target.value.length; autosize(e.target); touch(); });

    const btn = e.target.closest('[data-act]'); if (!btn) return;

      removeRec(s, s.sentences[i].id); s.sentences.splice(i, 1, { id: uid(), text: a }, { id: uid(), text: b }); touch(); renderList(); focusSentence(i + 1, 0); return;
    }
    if (act === 'merge') { const nxt = s.sentences[i + 1]; if (!nxt) return; removeRec(s, s.sentences[i].id); removeRec(s, nxt.id); const joined = (s.sentences[i].text + ' ' + nxt.text).trim(); s.sentences.splice(i, 2, { id: uid(), text: joined }); touch(); renderList(); focusSentence(i, joined.length); return; }
    if (act === 'del') { removeRec(s, s.sentences[i].id); if (s.sentences.length === 1) { s.sentences[0].text = ''; } else s.sentences.splice(i, 1); touch(); renderList(); focusSentence(Math.min(i, s.sentences.length - 1)); }
  });
  // mouse users: clicking a card focuses it
  list.addEventListener('mousedown', (e) => { const card = e.target.closest('.sent'); if (card && !e.target.closest('textarea,button')) { card.querySelector('textarea').focus(); } });

function ledFor(x) {
  const r = recs.get(x.id); if (!r) return '';
  if (r.kind === 'ai') return r.textHash === textHash(x.text) ? '<i class="led lamp tiny" title="AI 내 목소리 생성됨"></i>' : '<i class="led stale tiny" title="문장이 바뀌어 다시 생성이 필요합니다"></i>';
  return '<i class="led next tiny" title="내 목소리 녹음 있음"></i>';
}
const aiCount = (s) => s.sentences.filter((x) => { const r = recs.get(x.id); return r && r.kind === 'ai'; }).length;
function voiceSummary(s) {
  const sample = recs.get('sample:' + s.id); const n = aiCount(s);
  if (n) return `${settings.elVoiceName || 'AI 목소리'} · ${n}/${s.sentences.length}문장 생성됨`;
  if (sample) return `샘플 ${fmtSec(sample.duration)} 녹음됨 · 이제 내 목소리를 만들 수 있습니다`;
  return '대본을 한 번 읽어 녹음하면 내 목소리로 전체를 만들 수 있습니다';
}
function aiEntrySummary(s) {
  if (!eleven.key()) return 'ElevenLabs 계정을 연결하면 녹음 없이도 내 목소리로 전체 대본을 만들 수 있습니다';
  const n = aiCount(s); const plan = aiPlan(s);

  return `${settings.elVoiceName || '목소리'} · ${n}/${s.sentences.length}문장 생성됨${plan.stale.length ? ` · ${plan.stale.length}문장 다시 생성 필요` : ''}`;
}

        <div class="stack" style="margin-top:auto">
          <div class="panel">${WIZ_STEPS.map((x, i) => `<div class="row between wiz-row ${i === wizard.step ? 'cur' : ''}"><span>${x.title}</span><span class="key ${wizard.got[x.id] ? 'lit' : 'x'}">${esc(wizard.got[x.id] ? keyName(wizard.got[x.id]) : i < wizard.step ? '건너뜀' : '·')}</span></div>`).join('')}</div>

function wizardDuplicate(id, key, otherId) {
  wizard.dup = `"${keyName(key)}"는 이미 ${ACTION_LABEL[otherId]} 버튼의 신호입니다. 두 버튼이 같은 신호를 보내고 있어 구분할 수 없습니다. 링의 모드를 바꾸거나 다른 버튼을 눌러 보세요. (마지막 신호: ${esc(lastGestureInfo)})`;

/* ---- remote diagnostics: every raw input, in order, so an unknown remote can be understood ---- */
const diag = { rows: [], t0: 0, moves: 0 };
function diagLog(text) {
  if (state.view !== 'diag') return;
  if (!diag.t0) diag.t0 = performance.now();
  diag.rows.unshift(`${((performance.now() - diag.t0) / 1000).toFixed(2).padStart(6)}s  ${text}`);
  diag.rows.length = Math.min(diag.rows.length, 80);
  const el = $('#diagList'); if (el) el.textContent = diag.rows.join('\n');
}
function renderDiag() {
  document.body.classList.add('swipe-lock'); setVolumeCapture(true);
  app.innerHTML = `
    ${topbar({ left: `<button class="btn icon ghost" id="back" aria-label="뒤로">${ICON.back}</button>`, title: brand(), right: '' })}
    <main class="view" style="touch-action:none">
      <h2>리모컨 진단</h2>
      <p class="hint">리모컨 버튼을 하나씩 눌러 보세요. 들어오는 모든 신호가 시간순(최신이 위)으로 기록됩니다. 화면을 캡처해서 보내 주시면 됩니다. 이 화면에서는 손가락 터치도 그대로 기록됩니다.</p>
      <div class="row"><button class="btn small" id="diagClear">지우기</button><button class="btn small" id="diagCopy">복사</button><span class="hint grow" id="diagNote"></span></div>
      <pre class="diag-list" id="diagList">${esc(diag.rows.join('\n')) || '아직 신호가 없습니다'}</pre>
    </main>`;
  $('#back').onclick = () => history.length > 1 ? history.back() : go('/');
  $('#diagClear').onclick = () => { diag.rows = []; diag.t0 = 0; $('#diagList').textContent = '아직 신호가 없습니다'; };
  $('#diagCopy').onclick = async () => { try { await navigator.clipboard.writeText(diag.rows.slice().reverse().join('\n')); toast('복사했습니다'); } catch { toast('복사할 수 없습니다. 화면을 캡처해 주세요'); } };
  media.start();
}
(function attachDiag() {
  const pos = (e) => { const t = (e.changedTouches && e.changedTouches[0]) || e; return `${Math.round(t.clientX)},${Math.round(t.clientY)}`; };
  window.addEventListener('keydown', (e) => diagLog(`keydown  key=${e.key} code=${e.code} keyCode=${e.keyCode}${e.repeat ? ' repeat' : ''}`), true);
  window.addEventListener('keyup', (e) => diagLog(`keyup    key=${e.key} code=${e.code} keyCode=${e.keyCode}`), true);
  window.addEventListener('pointerdown', (e) => diagLog(`pointer↓ ${e.pointerType} button=${e.button} at ${pos(e)}`), true);
  window.addEventListener('pointerup', (e) => diagLog(`pointer↑ ${e.pointerType} at ${pos(e)}`), true);
  window.addEventListener('pointercancel', (e) => diagLog(`pointer✕ ${e.pointerType} at ${pos(e)}`), true);
  let ts = null;
  window.addEventListener('touchstart', (e) => { ts = { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY, t: performance.now(), n: 0 }; diagLog(`touch↓   at ${pos(e)} fingers=${e.touches.length}`); }, { capture: true, passive: true });
  window.addEventListener('touchmove', (e) => { if (ts) ts.n++; }, { capture: true, passive: true });
  const endT = (e, kind) => { if (!ts) { diagLog(`${kind} (시작 없음)`); return; } const t = e.changedTouches[0]; diagLog(`${kind} at ${pos(e)}  이동 dx=${Math.round(t.clientX - ts.x)} dy=${Math.round(t.clientY - ts.y)}  ${Math.round(performance.now() - ts.t)}ms  move=${ts.n}회`); ts = null; };
  window.addEventListener('touchend', (e) => endT(e, 'touch↑  '), { capture: true, passive: true });
  window.addEventListener('touchcancel', (e) => endT(e, 'touch✕  '), { capture: true, passive: true });
  window.addEventListener('wheel', (e) => diagLog(`wheel    dy=${Math.round(e.deltaY)} dx=${Math.round(e.deltaX)}`), { capture: true, passive: true });
  window.addEventListener('scroll', (e) => diagLog(`scroll   ${e.target === document ? 'page' : (e.target.id || e.target.className || 'el')}`), true);
  window.addEventListener('contextmenu', (e) => diagLog('contextmenu (길게 누름)'), true);
})();

function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2400); }
window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); state.installPrompt = e; if (state.view === 'home') render(); });
if (!NATIVE && 'serviceWorker' in navigator && location.protocol.startsWith('http')) {
  try {
    navigator.serviceWorker.register('sw.js').then((reg) => {
      const check = () => reg.update().catch(() => {});
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') check(); });
      setInterval(check, 5 * 60 * 1000);
    }).catch(() => {});
    let reloading = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (reloading || !navigator.serviceWorker.controller) return; reloading = true;
      // a new build took over: reload right away unless a presentation or a recording is in progress
      if (inputView() || aiJob.running) toast('새 버전이 준비됐습니다. 홈으로 나가면 적용됩니다');
      else location.reload();
    });
  } catch {}
}

route();
</script>
