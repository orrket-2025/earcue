<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2E3238">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<!--APP-START-->
<title>EarCue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@200;300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: dark;
  --bg-hi:#3D424A; --bg-lo:#2A2E34;
  --face:#3A3F46; --face-hi:#454A52; --face-lo:#30343A;
  --well:#24272C; --well-deep:#1C1F23;
  --edge-light:rgba(255,255,255,.10); --edge-dark:rgba(0,0,0,.55);
  --text:#D9DCE1; --text-soft:#9DA2AA; --text-dim:#6F757E;
  --lamp:#F1F3F6; --lamp-glow:rgba(241,243,246,.35);
  --led-now:#FF5A4E; --led-next:#5FD394; --led-off:#4C5158;
  --danger:#E0554B;
  --sans:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --raise: inset 0 1px 0 var(--edge-light), inset 0 -1px 0 rgba(0,0,0,.35), 0 8px 18px rgba(0,0,0,.35), 0 1px 2px rgba(0,0,0,.5);
  --sink: inset 0 2px 5px rgba(0,0,0,.65), inset 0 -1px 0 rgba(255,255,255,.05), 0 1px 0 rgba(255,255,255,.06);
  --r:14px;
}
*{box-sizing:border-box}
html,body{height:100%;overscroll-behavior-y:none}
body{
  margin:0; font-family:var(--sans); color:var(--text); font-size:16px; line-height:1.5;
  background:
    radial-gradient(120% 80% at 50% -10%, rgba(255,255,255,.07), transparent 60%),
    linear-gradient(180deg,var(--bg-hi) 0%,var(--bg-lo) 100%) fixed;
  -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;
  overscroll-behavior:none;
}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--lamp);outline-offset:3px;border-radius:6px}
[hidden]{display:none!important}
::selection{background:rgba(241,243,246,.25)}

/* ---------- shell ---------- */
.app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:0 18px env(safe-area-inset-bottom)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(14px + env(safe-area-inset-top)) 0 10px;min-height:64px}
.topbar .left,.topbar .right{display:flex;align-items:center;gap:10px;min-width:0}
.brand{display:flex;flex-direction:column;align-items:center;line-height:1;letter-spacing:.32em;text-transform:uppercase;user-select:none}
.brand b{font-weight:600;font-size:26px;letter-spacing:.18em;text-shadow:0 1px 0 rgba(255,255,255,.12),0 -1px 0 rgba(0,0,0,.5)}
.brand small{font-weight:300;font-size:11px;color:var(--text-soft);margin-top:6px;padding-top:6px;border-top:1px solid var(--edge-dark);box-shadow:0 1px 0 var(--edge-light) inset}
.hero-brand{padding:38px 0 18px;text-align:center}
.hero-brand .brand b{font-size:40px;font-weight:500}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-dim)}
h1,h2,h3{margin:0;font-weight:500}
h2{font-size:15px;color:var(--text-soft);letter-spacing:.02em}
p{margin:0}
.muted{color:var(--text-soft)}
.dim{color:var(--text-dim)}
.mono{font-family:var(--mono)}

/* ---------- hardware primitives ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:0 18px;height:46px;border-radius:12px;font-weight:500;font-size:15px;color:var(--text);
  background:linear-gradient(180deg,var(--face-hi),var(--face-lo));
  box-shadow:var(--raise); text-shadow:0 1px 0 rgba(0,0,0,.4);
  transition:transform .08s ease, box-shadow .08s ease, filter .12s ease; user-select:none; touch-action:manipulation;
}
.btn:hover{filter:brightness(1.06)}
.btn:active,.btn.is-down{transform:translateY(1px);box-shadow:inset 0 2px 6px rgba(0,0,0,.6),0 1px 0 rgba(255,255,255,.06)}
.btn.lamp{color:#20242A;text-shadow:0 1px 0 rgba(255,255,255,.35);background:linear-gradient(180deg,#F6F7F9,#CFD3D9);box-shadow:var(--raise),0 0 22px var(--lamp-glow)}
.btn.lamp:active{box-shadow:inset 0 2px 6px rgba(0,0,0,.35),0 0 12px var(--lamp-glow)}
.btn.small{height:36px;padding:0 13px;font-size:13px;border-radius:10px}
.btn.icon{width:46px;padding:0}
.btn.icon.small{width:36px}
.btn.ghost{background:none;box-shadow:none;color:var(--text-soft)}
.btn.ghost:hover{color:var(--text);filter:none}
.btn.ghost:active{box-shadow:none;transform:none;color:var(--text-dim)}
.btn.danger{color:#FFB0A9}
.btn:disabled{opacity:.45;cursor:default;filter:none;transform:none}
.btn svg{width:18px;height:18px;fill:currentColor;flex:none}

.panel{
  border-radius:var(--r);padding:16px;
  background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(0,0,0,.08));
  box-shadow:inset 0 1px 0 var(--edge-light),inset 0 0 0 1px rgba(0,0,0,.25),0 10px 24px rgba(0,0,0,.28);
}
.well{
  border-radius:12px;background:linear-gradient(180deg,var(--well-deep),var(--well));
  box-shadow:var(--sink);
}
.field{width:100%;padding:12px 14px;border:0;border-radius:12px;background:linear-gradient(180deg,var(--well-deep),var(--well));box-shadow:var(--sink);color:var(--text);resize:none;line-height:1.55}
.field::placeholder{color:var(--text-dim)}
.field:focus{outline:0;box-shadow:var(--sink),0 0 0 2px rgba(241,243,246,.18)}
select.field{appearance:none;background-image:linear-gradient(180deg,var(--well-deep),var(--well)),none;padding-right:36px;position:relative}
.select-wrap{position:relative}
.select-wrap::after{content:"";position:absolute;right:14px;top:50%;width:8px;height:8px;border-right:1.5px solid var(--text-soft);border-bottom:1.5px solid var(--text-soft);transform:translateY(-70%) rotate(45deg);pointer-events:none}

/* LED */
.led{width:9px;height:9px;border-radius:50%;background:var(--led-off);box-shadow:inset 0 1px 1px rgba(0,0,0,.6),0 1px 0 rgba(255,255,255,.08);flex:none}
.led.now{background:radial-gradient(circle at 40% 35%,#FF9D95,var(--led-now) 60%);box-shadow:0 0 8px rgba(255,90,78,.75),0 0 2px rgba(255,90,78,.9)}
.led.next{background:radial-gradient(circle at 40% 35%,#B4F0CF,var(--led-next) 60%);box-shadow:0 0 8px rgba(95,211,148,.7)}
.led.lamp{background:radial-gradient(circle at 40% 35%,#fff,var(--lamp) 60%);box-shadow:0 0 8px var(--lamp-glow)}
.led.blink{animation:blink .9s steps(2,start) infinite}
@keyframes blink{to{visibility:hidden}}

/* rocker switch */
.switch{display:flex;align-items:center;justify-content:space-between;gap:14px;width:100%;text-align:left;padding:12px 0;border-top:1px solid rgba(0,0,0,.3);box-shadow:0 1px 0 rgba(255,255,255,.04) inset}
.switch:first-child{border-top:0;box-shadow:none}
.switch .label{display:flex;flex-direction:column;gap:2px;min-width:0}
.switch .label span{font-size:15px}
.switch .label small{font-size:12.5px;color:var(--text-soft)}
.rocker{position:relative;flex:none;width:58px;height:34px;border-radius:9px;background:linear-gradient(180deg,var(--well-deep),var(--well));box-shadow:var(--sink)}
.rocker::before{content:"";position:absolute;top:3px;left:3px;width:26px;height:28px;border-radius:7px;background:linear-gradient(180deg,#5A6068,#3C4148);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),inset 0 -2px 0 rgba(0,0,0,.35),0 2px 4px rgba(0,0,0,.5);transition:transform .16s cubic-bezier(.3,.9,.4,1.1)}
.rocker::after{content:"";position:absolute;right:11px;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:var(--led-off);box-shadow:inset 0 1px 1px rgba(0,0,0,.6);transition:.16s}
.switch[aria-checked="true"] .rocker::before{transform:translateX(26px)}
.switch[aria-checked="true"] .rocker::after{right:auto;left:11px;background:var(--lamp);box-shadow:0 0 8px var(--lamp-glow)}

/* lit slider (read-through) */
.track{position:relative;height:10px;border-radius:5px;background:linear-gradient(180deg,var(--well-deep),var(--well));box-shadow:var(--sink)}
.track .fill{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:linear-gradient(180deg,#FAFBFC,#C9CED6);box-shadow:0 0 12px var(--lamp-glow),inset 0 -1px 0 rgba(0,0,0,.2);width:0;transition:width .12s linear}
.track .thumb{position:absolute;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:radial-gradient(circle at 50% 35%,#F7F8FA,#B9BFC8 70%);box-shadow:0 2px 5px rgba(0,0,0,.6),inset 0 -2px 3px rgba(0,0,0,.2);left:0;transition:left .12s linear}

/* keycap */
.key{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:24px;padding:0 8px;border-radius:6px;font:500 11.5px/1 var(--mono);letter-spacing:.02em;color:var(--text);background:linear-gradient(180deg,var(--face-hi),var(--face-lo));box-shadow:inset 0 1px 0 var(--edge-light),0 2px 0 rgba(0,0,0,.45),0 3px 4px rgba(0,0,0,.3);vertical-align:middle}
.key.lit{color:#20242A;background:linear-gradient(180deg,#F6F7F9,#CFD3D9);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 2px 0 rgba(0,0,0,.45),0 0 12px var(--lamp-glow)}
.key.x{padding:0;min-width:22px;height:22px;color:var(--text-soft)}

/* ---------- views ---------- */
.view{flex:1;display:flex;flex-direction:column;gap:16px;padding-bottom:28px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px}
.row.between{justify-content:space-between}
.grow{flex:1;min-width:0}

/* library */
.script-list{display:flex;flex-direction:column;gap:10px}
.script-card{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px 16px;border-radius:var(--r);background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(0,0,0,.06));box-shadow:inset 0 1px 0 var(--edge-light),inset 0 0 0 1px rgba(0,0,0,.25),0 6px 16px rgba(0,0,0,.25);transition:transform .08s}
.script-card:active{transform:translateY(1px)}
.script-card .title{font-weight:500;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.script-card .meta{font-family:var(--mono);font-size:11.5px;color:var(--text-dim);margin-top:3px;letter-spacing:.04em}
.script-card .go{color:var(--text-dim);flex:none}
.empty{padding:28px 16px;text-align:center;color:var(--text-soft);font-size:14.5px;line-height:1.7}
.drop{position:relative;border-radius:var(--r);padding:22px 16px;text-align:center;background:linear-gradient(180deg,var(--well-deep),var(--well));box-shadow:var(--sink);color:var(--text-soft);font-size:14.5px;line-height:1.7;transition:box-shadow .12s}
.drop.over{box-shadow:var(--sink),0 0 0 2px rgba(241,243,246,.35),0 0 24px var(--lamp-glow)}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.drop strong{display:block;color:var(--text);font-weight:500;font-size:15.5px}
.drop .formats{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--text-dim);margin-top:6px}

/* editor */
.title-input{font-size:20px;font-weight:500;padding:12px 14px}
.sent-list{display:flex;flex-direction:column;gap:8px;counter-reset:s}
.sent{position:relative;display:grid;grid-template-columns:36px 1fr;gap:0 8px;padding:10px 10px 10px 6px;border-radius:12px;background:linear-gradient(180deg,var(--well-deep),var(--well));box-shadow:var(--sink);transition:box-shadow .12s}
.sent.focus{box-shadow:var(--sink),0 0 0 2px rgba(241,243,246,.18)}
.sent .num{font-family:var(--mono);font-size:11px;color:var(--text-dim);text-align:right;padding-top:9px;letter-spacing:.02em}
.sent textarea{grid-column:2;width:100%;border:0;background:none;padding:6px 4px;line-height:1.6;resize:none;overflow:hidden;color:var(--text);min-height:36px}
.sent textarea:focus{outline:0}
.sent .tools{grid-column:2;display:none;flex-wrap:wrap;gap:6px;padding:6px 0 2px}
.sent.focus .tools{display:flex}
.sent .len{font-family:var(--mono);font-size:11px;color:var(--text-dim);margin-left:auto;align-self:center;letter-spacing:.04em}
.hint{font-size:13px;color:var(--text-dim);line-height:1.6}

/* stage */
.stage{gap:0;padding-bottom:calc(14px + env(safe-area-inset-bottom))}
.stage.swipe-mode{touch-action:none;overscroll-behavior:none}
.stage.swipe-mode .knob{touch-action:none}
body.swipe-lock{overflow:hidden;height:100dvh;touch-action:none;overscroll-behavior:none}
body.swipe-lock .app{height:100dvh;overflow:hidden}
body.swipe-lock .topbar{padding-top:calc(6px + env(safe-area-inset-top));min-height:48px}
body.swipe-lock .brand b{font-size:20px}
body.swipe-lock .brand small{display:none}
body.swipe-lock .stage-head{padding-bottom:6px}
body.swipe-lock .cue{padding:6px 0}
body.swipe-lock .cue.now{padding:12px 16px 14px}
body.swipe-lock .cue.now .text{font-size:clamp(19px,5vw,26px);min-height:2.6em}
body.swipe-lock .cue.now .track{margin-top:10px}
body.swipe-lock .cue.next .text{-webkit-line-clamp:2;font-size:14px}
body.swipe-lock .transport .btn{height:52px}
body.swipe-lock .deck{margin-top:8px;gap:10px}
body.swipe-lock .knob{width:104px;height:104px}
body.swipe-lock .knob .ticks i{transform-origin:50% 46px;top:4px;height:6px}
body.swipe-lock .knob .ticks i.major{height:8px}
body.swipe-lock .knob .labels span{transform-origin:50% 66px;top:-14px}
body.swipe-lock .knob .cap{inset:16px}
body.swipe-lock .knob-wrap{padding-top:12px;gap:2px}
body.swipe-lock .knob-readout .val{font-size:17px}
body.swipe-lock .knob-label{display:none}
body.swipe-lock .deck .switch{padding:6px 0}
body.swipe-lock .deck .switch .label small{display:none}
body.swipe-lock .remote-line{display:none}
body.swipe-lock .status{min-height:20px;padding:2px 2px}
.stage-head{display:flex;align-items:center;justify-content:space-between;gap:10px;font-family:var(--mono);font-size:13px;color:var(--text-soft);padding:4px 0 14px;letter-spacing:.06em}
.stage-head .counter{font-size:22px;color:var(--text);letter-spacing:.08em}
.stage-head .counter small{font-size:13px;color:var(--text-dim);margin-left:4px}
.cue{display:flex;flex-direction:column;gap:6px;padding:12px 0}
.cue .tag{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-dim)}
.cue .text{color:var(--text-soft);font-size:15px;line-height:1.6;word-break:keep-all;overflow-wrap:anywhere}
.cue.prev .text{color:var(--text-dim);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cue.now{padding:16px 18px 18px;border-radius:var(--r);background:linear-gradient(180deg,var(--well-deep),var(--well));box-shadow:var(--sink)}
.cue.now .tag{color:var(--text-soft)}
.cue.now .text{color:var(--lamp);font-size:clamp(21px,5.6vw,30px);font-weight:400;line-height:1.5;text-shadow:0 0 18px rgba(241,243,246,.18);min-height:2.9em}
.cue.now .track{margin-top:16px}
.cue.next .text{color:var(--text);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.cue.next .tag{color:var(--led-next)}
.status{display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-family:var(--mono);font-size:12px;color:var(--text-dim);min-height:24px;padding:6px 2px}
.status .chip{display:inline-flex;align-items:center;gap:7px;letter-spacing:.04em}
.status .chip.on{color:var(--text)}
.status .chip.warn{color:#FFB0A9}
.transport{display:grid;grid-template-columns:1fr 1fr 1.35fr;margin-top:8px;border-radius:14px;padding:3px;background:linear-gradient(180deg,var(--well-deep),var(--well));box-shadow:var(--sink)}
.transport .btn{border-radius:11px;height:62px;font-size:15.5px;padding:0 6px;white-space:nowrap;gap:6px;box-shadow:inset 0 1px 0 var(--edge-light),inset 0 -1px 0 rgba(0,0,0,.35),0 3px 8px rgba(0,0,0,.35)}
.transport .btn:active,.transport .btn.is-down{box-shadow:inset 0 2px 6px rgba(0,0,0,.6)}
.transport .btn svg{width:22px;height:22px}
.transport .btn + .btn{margin-left:3px}

/* cue stack (teleprompter roll) */
.cue-stack{display:flex;flex-direction:column;gap:6px;padding:4px 0 8px}
.ci{display:grid;grid-template-columns:34px 1fr;gap:0 6px;align-items:start;padding:6px 4px;min-height:44px;transition:opacity .2s}
.ci .n{font-family:var(--mono);font-size:11px;color:var(--text-dim);text-align:right;padding-top:4px;letter-spacing:.04em;display:flex;justify-content:flex-end;align-items:center;gap:5px}
.ci .text{font-size:15px;line-height:1.5;color:var(--text-soft);word-break:keep-all;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ci.d1{opacity:.85}
.ci.d2{opacity:.5}
.ci.d2 .text{font-size:14px}
.ci.before .text{color:var(--text-dim)}
.ci.after.d1 .text{color:var(--text)}
.ci.empty{min-height:44px}
.ci.now{display:block;padding:14px 18px 16px;border-radius:var(--r);background:linear-gradient(180deg,var(--well-deep),var(--well));box-shadow:var(--sink);min-height:0;transition:box-shadow .25s}
.ci.now.speaking{box-shadow:var(--sink),0 0 0 1px rgba(241,243,246,.18),0 0 26px rgba(241,243,246,.12)}
.ci.now .tag{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-soft);margin-bottom:6px}
.ci.now .tag .n{padding:0;margin-left:auto;font-size:11px}
.ci.now .text{display:block;-webkit-line-clamp:unset;overflow:visible;color:var(--lamp);font-size:clamp(21px,5.6vw,30px);font-weight:400;line-height:1.5;text-shadow:0 0 18px rgba(241,243,246,.18);min-height:2.9em}
.ci.now .track{margin-top:14px}
.stack-1 .ci:not(.now){display:none}
.stack-1 .ci.empty{display:none}
.seg.mini{grid-template-columns:repeat(3,44px);margin:0}
.seg.mini button{height:34px;font-family:var(--mono)}
body.swipe-lock .cue-stack{gap:2px;padding:0 0 4px}
body.swipe-lock .ci{min-height:32px;padding:3px 4px}
body.swipe-lock .ci .text{-webkit-line-clamp:1;font-size:13.5px}
body.swipe-lock .ci.empty{min-height:32px}
body.swipe-lock .ci.now{padding:10px 14px 12px}
body.swipe-lock .ci.now .text{font-size:clamp(19px,5vw,26px);min-height:2.6em}
body.swipe-lock .ci.now .track{margin-top:8px}

/* knob */
.deck{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;margin-top:18px}
.knob-wrap{display:flex;flex-direction:column;align-items:center;gap:6px;user-select:none}
.knob{position:relative;width:148px;height:148px;border-radius:50%;touch-action:none;cursor:grab;
  background:radial-gradient(circle at 50% 30%,#4C525A,#2B2F35 75%);
  box-shadow:inset 0 2px 4px rgba(255,255,255,.12),inset 0 -6px 10px rgba(0,0,0,.55),0 14px 28px rgba(0,0,0,.5),0 0 0 1px rgba(0,0,0,.4)}
.knob:active{cursor:grabbing}
.knob .ticks{position:absolute;inset:0;border-radius:50%}
.knob .ticks i{position:absolute;left:50%;top:6px;width:2px;height:8px;margin-left:-1px;background:var(--text-dim);border-radius:1px;transform-origin:50% 68px}
.knob .ticks i.major{height:11px;background:var(--text-soft)}
.knob .labels{position:absolute;inset:0;border-radius:50%;pointer-events:none}
.knob .labels span{position:absolute;left:50%;top:-16px;width:24px;height:16px;margin-left:-12px;transform-origin:50% 90px;display:flex;justify-content:center}
.knob .labels b{font:400 10px/1 var(--mono);color:var(--text-dim);letter-spacing:.02em}
.knob-wrap{padding-top:16px}
.knob .cap{position:absolute;inset:22px;border-radius:50%;
  background:radial-gradient(circle at 50% 28%,#4A4F57,#33373D 60%,#2C3036);
  box-shadow:inset 0 2px 3px rgba(255,255,255,.14),inset 0 -4px 8px rgba(0,0,0,.5),0 6px 12px rgba(0,0,0,.55);

const $ = (s, el = document) => el.querySelector(s);

const ICON = {

/* ---------------- sample script ---------------- */
const SAMPLE_TITLE = '샘플 · 분기 제품 발표';
const SAMPLE_TEXT = `안녕하세요. 오늘 3분기 제품 로드맵을 발표하게 된 제품팀의 김지수입니다.
오늘 발표는 세 부분으로 나뉩니다. 먼저 지난 분기 성과를 짧게 돌아보고, 다음으로 새 기능 세 가지를 소개한 뒤, 마지막으로 출시 일정을 공유하겠습니다.

지난 분기 월간 활성 사용자는 42만 명으로, 전 분기 대비 18% 성장했습니다. 특히 모바일 앱의 재방문율이 눈에 띄게 올랐습니다.
이 성장의 절반 이상은 온보딩 개선에서 나왔습니다. 첫 사용 후 7일 안에 두 번째 방문을 하는 비율이 31%에서 47%로 뛰었습니다.

이제 새 기능을 말씀드리겠습니다. 첫 번째는 오프라인 모드입니다. 인터넷이 끊겨도 마지막으로 열었던 문서를 그대로 보고 편집할 수 있습니다.
두 번째는 팀 공유 폴더입니다. 폴더 하나를 공유하면 그 안의 모든 문서에 같은 권한이 적용됩니다.
세 번째는 음성 메모입니다. 녹음하면 자동으로 텍스트가 붙고, 문장 단위로 검색이 됩니다.

출시 일정입니다. 오프라인 모드는 다음 달 첫째 주에 베타로 열고, 팀 공유 폴더는 그 다음 달에 정식 출시합니다. 음성 메모는 연말까지 마무리하겠습니다.
질문이 있으시면 지금 받겠습니다. 감사합니다.`;

/* ---------------- storage ---------------- */
/* Defaults cover presentation clickers (PageUp/Down, arrows, F5), remotes in music mode (media keys) and

const DEFAULT_KEYMAP = {
  next: ['PageDown', 'ArrowRight', 'ArrowDown', ' ', 'Media:next', 'Swipe↑'],
  prev: ['PageUp', 'ArrowLeft', 'ArrowUp', 'Media:prev', 'Swipe↓'],
  play: ['F5', '.', 'Enter', 'b', 'Media:play', 'Tap'],
};
const DEFAULT_SETTINGS = { rate: 1.3, voiceURI: '', auto: false, lead: 2, listen: false, keymap: DEFAULT_KEYMAP, voiceSource: 'mine', recAdvance: true, stack: 5, elVoiceId: '', elVoiceName: '', elPreset: 'calm', elKeepRec: true };

const store = {
  load(k, d) { try { const v = localStorage.getItem('earcue.' + k); return v ? JSON.parse(v) : d; } catch { return d; } },
  save(k, v) { try { localStorage.setItem('earcue.' + k, JSON.stringify(v)); } catch { toast('저장 공간이 부족합니다'); } },
};
let scripts = store.load('scripts', []);
let settings = Object.assign({}, DEFAULT_SETTINGS, store.load('settings', {}));
settings.keymap = Object.assign({}, DEFAULT_KEYMAP, settings.keymap || {});
const saveScripts = () => store.save('scripts', scripts);
const saveSettings = () => store.save('settings', settings);

/* ---------------- sentence splitting ---------------- */
const TERM = '.!?。！？';
const CLOSERS = '"\'”’」』)]』】';
function splitLine(t) {
  const res = []; let start = 0;
  for (let i = 0; i < t.length; i++) {
    if (!TERM.includes(t[i])) continue;
    let j = i;
    while (j + 1 < t.length && TERM.includes(t[j + 1])) j++;
    while (j + 1 < t.length && CLOSERS.includes(t[j + 1])) j++;
    if (j + 1 >= t.length || /\s/.test(t[j + 1])) {
      const piece = t.slice(start, j + 1).trim();
      if (piece) res.push(piece);
      start = j + 1; i = j;
    }
  }
  const rest = t.slice(start).trim();
  if (rest) res.push(rest);
  return res;
}
function splitSentences(text) {
  return String(text).replace(/\r/g, '').split(/\n+/).flatMap((l) => splitLine(l.trim()));
}
const mkSentences = (arr) => arr.map((text) => ({ id: uid(), text }));

/* ---------------- my-voice recordings (IndexedDB) ---------------- */
const idb = {
  db: null,
  open() {
    if (this.db) return Promise.resolve(this.db);
    return new Promise((res, rej) => {
      if (!window.indexedDB) return rej(new Error('no-idb'));
      const req = indexedDB.open('earcue', 1);
      req.onupgradeneeded = () => { const db = req.result; if (!db.objectStoreNames.contains('recordings')) db.createObjectStore('recordings', { keyPath: 'id' }).createIndex('scriptId', 'scriptId'); };
      req.onsuccess = () => { this.db = req.result; res(this.db); };
      req.onerror = () => rej(req.error);

  async write(fn) { const db = await this.open(); return new Promise((res, rej) => { const t = db.transaction('recordings', 'readwrite'); fn(t.objectStore('recordings')); t.oncomplete = () => res(); t.onerror = () => rej(t.error); }); },
  put(rec) { return this.write((st) => st.put(rec)); },
  del(id) { return this.write((st) => st.delete(id)); },
  async byScript(scriptId) { const db = await this.open(); return new Promise((res, rej) => { const req = db.transaction('recordings').objectStore('recordings').index('scriptId').getAll(scriptId); req.onsuccess = () => res(req.result || []); req.onerror = () => rej(req.error); }); },
};

async function loadRecs(scriptId) {
  recs.forEach((r) => r.url && URL.revokeObjectURL(r.url)); recs.clear();
  try { for (const r of await idb.byScript(scriptId)) recs.set(r.id, r); } catch {}

const recUrl = (r) => r.url || (r.url = URL.createObjectURL(r.blob));
const fmtSec = (ms) => (ms / 1000).toFixed(1) + 's';
function syncRecCount(script) { script.recCount = script.sentences.filter((x) => recs.has(x.id)).length; saveScripts(); }
async function saveRec(script, sentenceId, take, extra = {}) {
  const r = { id: sentenceId, scriptId: script.id, blob: take.blob, duration: take.duration, mime: take.mime, createdAt: Date.now(), kind: 'rec', ...extra };
  try { await idb.put(r); } catch { toast('녹음을 저장할 수 없습니다 (저장 공간 확인)'); return false; }

  recs.set(sentenceId, r); syncRecCount(script); return true;
}
async function removeRec(script, id) { const r = recs.get(id); if (!r) return; if (r.url) URL.revokeObjectURL(r.url); recs.delete(id); try { await idb.del(id); } catch {} syncRecCount(script); }
async function removeAllRecs(scriptId) { try { for (const r of await idb.byScript(scriptId)) await idb.del(r.id); } catch {} recs.clear(); }

const recPlayer = {
  audio: null, raf: 0, playing: false, t0: 0,
  play(rec, { onStart, onProgress, onEnd } = {}) {
    this.stop();
    const a = new Audio(recUrl(rec));

    a.playbackRate = clamp(settings.rate, 0.5, 5);

    a.onplaying = () => {
      if (this.playing) return; this.playing = true; this.t0 = performance.now(); onStart && onStart();

  },

const recorder = {
  stream: null, mr: null, chunks: [], t0: 0, ctx: null, analyser: null, raf: 0, onLevel: null,
  get active() { return !!(this.mr && this.mr.state === 'recording'); },
  async prepare() {
    if (this.stream) return true;
    if (!navigator.mediaDevices || !window.MediaRecorder) { toast('이 브라우저는 녹음을 지원하지 않습니다'); return false; }

    catch { toast('마이크 사용이 허용되지 않았습니다'); return false; }

          <button class="btn ghost" id="sample">샘플 대본</button>
        </div>
        <p class="hint">대본은 이 기기 안에만 저장됩니다. 한 번 불러온 뒤에는 인터넷 없이도 발표 화면을 쓸 수 있습니다.</p>
      </section>
    </main>`;
  app.querySelectorAll('[data-open]').forEach((b) => b.onclick = () => go('/edit/' + b.dataset.open));
  const drop = $('#drop'), file = $('#file');
  file.onchange = () => { if (file.files[0]) importFile(file.files[0]); file.value = ''; };
  ['dragenter', 'dragover'].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add('over'); }));
  ['dragleave', 'drop'].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove('over'); }));
  drop.addEventListener('drop', (e) => { const f = e.dataTransfer.files[0]; if (f) importFile(f); });
  $('#fromPaste').onclick = () => { const t = $('#paste').value.trim(); if (!t) { toast('붙여넣은 내용이 없습니다'); return; } addScript(t.split('\n')[0].slice(0, 40), t); };
  $('#sample').onclick = () => addScript(SAMPLE_TITLE, SAMPLE_TEXT);
  const inst = $('#install'); if (inst) inst.onclick = async () => { const p = state.installPrompt; if (!p) return; p.prompt(); await p.userChoice; state.installPrompt = null; render(); };
}

function addScript(title, text) {
  const sentences = mkSentences(splitSentences(text));
  if (!sentences.length) { toast('문장을 찾지 못했습니다'); return; }
  const s = { id: uid(), title: title.trim() || '제목 없음', sentences, createdAt: Date.now(), updatedAt: Date.now() };
  scripts.push(s); saveScripts();
  toast(`${sentences.length}개 문장으로 나눴습니다`);
  go('/edit/' + s.id);
}

async function importFile(f) {
  const name = f.name.replace(/\.[^.]+$/, '');
  if (/\.docx$/i.test(f.name)) {
    try {
      if (!window.mammoth) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.8.0/mammoth.browser.min.js');
      const res = await window.mammoth.extractRawText({ arrayBuffer: await f.arrayBuffer() });
      addScript(name, res.value);
    } catch { toast('DOCX를 읽으려면 인터넷 연결이 필요합니다. TXT로 저장해서 올려 주세요.'); }
    return;
  }
  addScript(name, await f.text());
}
function loadScript(src) { return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); }

function ledFor(x) {
  const r = recs.get(x.id); if (!r) return '';
  if (r.kind === 'ai') return r.textHash === textHash(x.text) ? '<i class="led lamp tiny" title="AI 내 목소리 생성됨"></i>' : '<i class="led stale tiny" title="문장이 바뀌어 다시 생성이 필요합니다"></i>';
  return '<i class="led next tiny" title="내 목소리 녹음 있음"></i>';
}
const aiCount = (s) => s.sentences.filter((x) => { const r = recs.get(x.id); return r && r.kind === 'ai'; }).length;
function aiEntrySummary(s) {
  if (!eleven.key()) return 'ElevenLabs 계정을 연결하면 녹음 없이도 내 목소리로 전체 대본을 만들 수 있습니다';
  const n = aiCount(s); const plan = aiPlan(s);
  if (!n) return settings.elVoiceName ? `${settings.elVoiceName} · 아직 생성한 문장이 없습니다` : '목소리를 선택하거나 만들어 주세요';
  return `${settings.elVoiceName || '목소리'} · ${n}/${s.sentences.length}문장 생성됨${plan.stale.length ? ` · ${plan.stale.length}문장 다시 생성 필요` : ''}`;
}

    ${topbar({ left: `<button class="btn icon ghost" id="back" aria-label="편집으로">${ICON.back}</button>`, title: brand(), right: `<button class="btn icon ghost" id="settings" aria-label="설정">${ICON.gear}</button>` })}
    <main class="view stage ${['Swipe↑', 'Swipe↓', 'Swipe←', 'Swipe→', 'Tap', 'DoubleTap'].some((k) => Object.values(settings.keymap).some((arr) => arr.includes(k))) ? 'swipe-mode' : ''}" id="stage" tabindex="0">
      <div class="stage-head">

            <div class="labels">${[1, 1.5, 2, 3, 5].map((r) => `<span style="transform:rotate(${rateToAngle(r)}deg)"><b style="transform:rotate(${-rateToAngle(r)}deg)">${r}</b></span>`).join('')}</div>

          <button class="switch" role="switch" id="swListen" aria-checked="${settings.listen}"><span class="label"><span>말 인식</span><small>문장을 말하면 다음으로</small></span><span class="rocker"></span></button>

  $('#back').onclick = () => go('/edit/' + s.id);

  $('#play').onclick = () => act('play');
  $('#next').onclick = () => act('next');
  $('#rateDown').onclick = () => nudgeRate(-1);
  $('#rateUp').onclick = () => nudgeRate(1);
  $('#swAuto').onclick = () => { settings.auto = !settings.auto; saveSettings(); $('#swAuto').setAttribute('aria-checked', settings.auto); if (!settings.auto) cancelAuto(); renderStageStatus(); };

function keyHints(playLabel = '읽기') {
  const km = settings.keymap;
  const show = (arr) => arr.slice(0, 2).map((k) => `<span class="key">${esc(keyName(k))}</span>`).join(' ');
  return `${show(km.next)} 다음 <span class="sep">·</span> ${show(km.prev)} 이전 <span class="sep">·</span> ${show(km.play)} ${playLabel}`;
}
function keyName(k) { return ({ 'Media:next': '다음곡', 'Media:prev': '이전곡', 'Media:play': '재생/일시정지', 'Swipe↑': '위로 쓸기', 'Swipe↓': '아래로 쓸기', 'Tap': '탭', 'DoubleTap': '두 번 탭', 'Swipe←': '왼쪽으로 쓸기', 'Swipe→': '오른쪽으로 쓸기', 'Wheel↓': '휠↓', 'Wheel↑': '휠↑', 'Scroll↓': '스크롤↓', 'Scroll↑': '스크롤↑', 'Mouse0': '클릭', 'Mouse1': '가운데클릭', 'Mouse2': '우클릭', 'Mouse3': '마우스4', 'Mouse4': '마우스5', ' ': 'Space', 'ArrowRight': '→', 'ArrowLeft': '←', 'ArrowUp': '↑', 'ArrowDown': '↓', 'PageDown': 'PgDn', 'PageUp': 'PgUp', '.': '.', 'Escape': 'Esc' })[k] || (k.length === 1 ? k.toUpperCase() : k); }

/* The stage shows a window of sentences with the current one centred, like a teleprompter roll:
   dimmer with distance, the next one carries the green preview lamp, the current one the red on-air lamp. */
function updateCue() {
  const s = current(); if (!s || state.view !== 'stage') return;
  const i = state.idx; const n = s.sentences.length; const half = Math.floor((settings.stack || 5) / 2);
  $('#cur').textContent = String(i + 1).padStart(2, '0');
  const items = [];
  for (let k = i - half; k <= i + half; k++) {
    const d = Math.abs(k - i);
    if (k < 0 || k >= n) { items.push(`<div class="ci empty d${d}"></div>`); continue; }
    const x = s.sentences[k];
    if (k === i) items.push(`<div class="ci now"><div class="tag"><i class="led now" id="ledNow"></i>지금<span class="n">${k + 1}</span></div><div class="text" id="nowText">${esc(x.text)}</div><div class="track" aria-hidden="true"><div class="fill" id="fill"></div><div class="thumb" id="thumb"></div></div></div>`);
    else items.push(`<div class="ci d${d} ${k < i ? 'before' : 'after'}"><span class="n">${k === i + 1 ? '<i class="led next"></i>' : ''}${k + 1}</span><div class="text">${esc(x.text)}</div></div>`);
  }
  if (i === n - 1) items[half] = items[half].replace('지금<span', '마지막 문장<span');
  const st = $('#cueStack'); st.className = `cue-stack stack-${settings.stack || 5}`; st.innerHTML = items.join('');
  setProgress(0);
  $('#next').disabled = false;
}
function setProgress(p) {
  state.progress = p; const f = $('#fill'), t = $('#thumb'); if (!f) return;
  f.style.width = (p * 100) + '%'; t.style.left = (p * 100) + '%';
}
function renderStageStatus() {
  const el = $('#status'); if (!el) return;
  const chips = [];
  const sp = isSpeaking();
  chips.push(`<span class="chip ${sp ? 'on' : ''}"><i class="led ${sp ? 'lamp' : ''}"></i>${sp ? (state.usingRec === 'ai' ? 'AI 내 목소리' : state.usingRec ? '내 목소리' : '읽는 중') : '대기'}</span>`);
  if (state.recMissing) chips.push(`<span class="chip"><i class="led"></i>녹음 없음 · 기기 음성</span>`);
  if (settings.auto) chips.push(`<span class="chip on" id="autoChip"><i class="led lamp ${state.autoDue ? 'blink' : ''}"></i>자동 <span id="autoCount">${state.autoDue ? ((state.autoDue - performance.now()) / 1000).toFixed(1) + 's' : settings.lead + 's'}</span></span>`);
  if (settings.listen) chips.push(`<span class="chip on"><i class="led ${listener.on && !listener.suspended ? 'next' : ''}"></i>말 인식 ${!listener.on ? '꺼짐' : listener.suspended ? '대기' : '듣는 중'}</span>`);
  if (media.ready) chips.push(`<span class="chip"><i class="led lamp"></i>미디어 키 대기</span>`);
  if (state.ttsNote) chips.push(`<span class="chip warn">${esc(state.ttsNote)}</span>`);
  el.innerHTML = chips.join('');
  const led = $('#ledNow'); if (led) led.classList.toggle('blink', sp);
  const nowCard = $('.ci.now'); if (nowCard) nowCard.classList.toggle('speaking', sp);
}
function tickElapsed() {
  if (state.view !== 'stage') return;
  const el = $('#elapsed'); if (el) el.textContent = state.startedAt ? fmtTime(performance.now() - state.startedAt) : '00:00';
  const ac = $('#autoCount'); if (ac && state.autoDue) ac.textContent = Math.max(0, (state.autoDue - performance.now()) / 1000).toFixed(1) + 's';
  setTimeout(tickElapsed, 200);
}

/* transport actions */
function act(kind) {
  const s = current(); if (!s || state.view !== 'stage') return;
  cancelAuto(); state.ttsNote = '';
  if (kind === 'next') { if (state.idx >= s.sentences.length - 1) { finishTalk(); return; } state.idx++; }
  if (kind === 'prev') { state.idx = Math.max(0, state.idx - 1); }
  updateCue(); speakCurrent();
  flashButton(kind);
}
function flashButton(kind) { const b = $('#' + kind); if (!b) return; b.classList.add('is-down'); setTimeout(() => b.classList.remove('is-down'), 140); }
function speakCurrent() {
  const s = current(); const text = s.sentences[state.idx].text.trim();
  if (!state.startedAt) state.startedAt = performance.now();
  listener.mark(); listener.suspend();
  if (!text) { setProgress(1); listener.resume(); return; }
  speakSentence(s.sentences[state.idx], {
    onStart: () => { state.speakT0 = performance.now(); renderStageStatus(); },
    onProgress: setProgress,
    onEnd: ({ cancelled, dur, rate }) => {
      if (cancelled) { if (tts.lastError && tts.lastError !== 'canceled') { state.ttsNote = '읽기 중단: ' + tts.lastError; renderStageStatus(); } return; }
      state.ttsNote = tts.lastError ? '읽기 오류: ' + tts.lastError : '';
      setProgress(1); listener.resume(); renderStageStatus();
      if (settings.auto && state.idx < s.sentences.length - 1) scheduleAuto(dur, rate);
    },
  });
}
function finishTalk() {
  stopVoice(); listener.stop();
  const s = current();
  $('#stage').innerHTML = `
    <div class="done-card"><div class="big">발표가 끝났습니다</div><p class="muted">${s.sentences.length}문장 · ${fmtTime(performance.now() - state.startedAt)}</p></div>
    <div class="row" style="margin-top:16px"><button class="btn grow" id="again">처음부터</button><button class="btn lamp grow" id="home">대본 목록</button></div>`;
  $('#again').onclick = () => { state.idx = 0; state.startedAt = 0; renderStage(); };
  $('#home').onclick = () => go('/');
}

/* ---- record view: the presenter reads each sentence once, in their own voice ---- */
function renderRecord() {
  const s = current(); const n = s.sentences.length; const i = state.idx = clamp(state.idx, 0, n - 1);
  const sent = s.sentences[i]; const r = recs.get(sent.id); const done = s.sentences.filter((x) => recs.has(x.id)).length;
  const on = state.recording;
  app.innerHTML = `
    ${topbar({ left: `<button class="btn icon ghost" id="back" aria-label="편집으로">${ICON.back}</button>`, title: brand(), right: `<span class="mono rec-count"><b>${done}</b>/${n} 녹음</span>` })}
    <main class="view stage" id="stage" tabindex="0">
      <div class="stage-head">
        <span id="recTime">${r && !on ? fmtSec(r.duration) : '00:00'}</span>
        <span class="counter"><span>${String(i + 1).padStart(2, '0')}</span><small>/ ${String(n).padStart(2, '0')}</small></span>
        <span id="keyflash" class="key x" aria-label="마지막 리모컨 신호">·</span>
      </div>
      <div class="cue now">
        <div class="tag"><i class="led ${on ? 'now blink' : r ? 'next' : ''}"></i><span>${on ? '녹음 중' : r ? '내 목소리 녹음 있음' : '아직 녹음 없음'}</span></div>
        <div class="text">${esc(sent.text) || '<span class="dim">빈 문장</span>'}</div>
        <div class="track" aria-hidden="true"><div class="fill" id="vu"></div></div>
      </div>
      <p class="hint center">${on ? '평소 발표하듯 읽고, 끝나면 정지를 누르세요.' : '가운데 버튼을 누르고 이 문장을 평소 발표하듯 읽으세요. 정지를 누르면 저장되고 다음 문장으로 넘어갑니다.'}</p>
      <div class="transport">
        <button class="btn" id="rPrev" ${i === 0 ? 'disabled' : ''}>${ICON.prev}이전</button>
        <button class="btn ${on ? 'rec-on' : 'lamp'}" id="rToggle">${on ? ICON.stop + '정지' : ICON.rec + (r ? '다시 녹음' : '녹음')}</button>
        <button class="btn" id="rNext" ${i === n - 1 ? 'disabled' : ''}>다음${ICON.next}</button>
      </div>
      <div class="row center-row">
        <button class="btn small" id="rPlay" ${r && !on ? '' : 'disabled'}>${ICON.play}들어보기</button>
        <button class="btn small ghost danger" id="rDel" ${r && !on ? '' : 'disabled'}>${ICON.trash}이 녹음 삭제</button>
      </div>
      <div class="switches bottom">
        <button class="switch" role="switch" id="swAdvance" aria-checked="${settings.recAdvance}"><span class="label"><span>정지하면 다음 문장으로</span><small>연속으로 빠르게 녹음할 때 켜 두세요</small></span><span class="rocker"></span></button>
      </div>
      <div class="remote-line"><span>리모컨</span>${keyHints('녹음/정지')}</div>
    </main>`;
  $('#back').onclick = () => go('/edit/' + s.id);
  $('#rToggle').onclick = toggleRecording;
  $('#rPrev').onclick = () => moveRecord(-1);
  $('#rNext').onclick = () => moveRecord(1);
  $('#rPlay').onclick = () => { const rr = recs.get(sent.id); if (rr) recPlayer.play(rr, { onProgress: (p) => { const v = $('#vu'); if (v) v.style.width = (p * 100) + '%'; }, onEnd: () => { const v = $('#vu'); if (v) v.style.width = '0%'; } }); };
  $('#rDel').onclick = async () => { await removeRec(s, sent.id); renderRecord(); };
  $('#swAdvance').onclick = () => { settings.recAdvance = !settings.recAdvance; saveSettings(); $('#swAdvance').setAttribute('aria-checked', settings.recAdvance); };
  recorder.onLevel = (lv) => { const v = $('#vu'); if (v && state.recording) v.style.width = Math.round(lv * 100) + '%'; };
  requestWakeLock();
  setTimeout(() => { const st = $('#stage'); if (st) st.focus({ preventScroll: true }); }, 50);
  tickRecTime();
}
function tickRecTime() {
  if (state.view !== 'record') return;
  if (state.recording) { const el = $('#recTime'); if (el) el.textContent = fmtTime(performance.now() - recorder.t0); }
  setTimeout(tickRecTime, 200);
}
async function toggleRecording() {
  const s = current(); if (!s || state.view !== 'record') return;
  if (state.recording) {
    const take = await recorder.stop(); state.recording = false;
    if (take) {
      if (await saveRec(s, s.sentences[state.idx].id, take)) {
        if (settings.recAdvance && state.idx < s.sentences.length - 1) { state.idx++; renderRecord(); return; }
        if (settings.recAdvance) toast('마지막 문장까지 녹음했습니다');
      }
    } else toast('너무 짧아서 저장하지 않았습니다');
    renderRecord(); return;
  }
  stopVoice();
  if (await recorder.start()) { state.recording = true; renderRecord(); }
}
async function moveRecord(dir) {
  const s = current(); if (!s) return;
  if (state.recording) { const take = await recorder.stop(); state.recording = false; if (take) await saveRec(s, s.sentences[state.idx].id, take); }
  stopVoice();
  state.idx = clamp(state.idx + dir, 0, s.sentences.length - 1); renderRecord();
}

/* auto advance: the earpiece read at N× took `dur`; the presenter saying it aloud at 1× takes about dur×N.
   Start the next sentence `lead` seconds before that natural end, measured from when the read began. */
function scheduleAuto(dur, rate) {
  const natural = dur * rate; // a recording's natural length is exactly what the presenter takes to say it
  const due = (state.speakT0 || performance.now() - dur) + natural - settings.lead * 1000;
  const delay = Math.max(0, due - performance.now());
  state.autoDue = performance.now() + delay;
  renderStageStatus();
  state.autoTimer = setTimeout(() => { state.autoDue = 0; act('next'); }, delay);
}
function cancelAuto() { clearTimeout(state.autoTimer); state.autoTimer = 0; state.autoDue = 0; }

/* listen mode */
function toggleListen(force) {
  const want = force === true ? true : !settings.listen;
  if (want) {
    if (!listener.start()) { settings.listen = false; }
    else { settings.listen = true; listener.onMatch = onHeard; if (force !== true) toast('마이크로 발표자의 말을 듣습니다'); }
  } else { listener.stop(); settings.listen = false; }
  saveSettings();
  const sw = $('#swListen'); if (sw) sw.setAttribute('aria-checked', settings.listen);
  renderStageStatus();
}
function onHeard(heard) {
  const s = current(); if (!s || state.view !== 'stage') return;
  if (isSpeaking()) return;
  const score = tailMatch(s.sentences[state.idx].text, heard);
  if (score >= 0.7) { listener.heard = ''; act('next'); }
}

/* rate knob */
/* Non-linear speed scale: the first half of the knob's travel covers 1.0–2.0× in fine 0.05 steps
   (where the ear can still follow), the second half covers 2.0–5.0× in 0.25 steps. */
const KNOB_TICKS = [1, 1.1, 1.2, 1.3, 1.4, 1.5, 1.6, 1.7, 1.8, 1.9, 2, 2.5, 3, 3.5, 4, 4.5, 5];
const rateToPos = (r) => r <= 2 ? (r - 1) / 2 : 0.5 + (r - 2) / 6;
const posToRate = (p) => p <= 0.5 ? 1 + p * 2 : 2 + (p - 0.5) * 6;
const rateToAngle = (r) => -135 + rateToPos(clamp(r, 1, 5)) * 270;
function snapRate(r) { const step = r <= 2 ? 0.05 : 0.25; return Math.round(clamp(r, 1, 5) / step) * step; }
function nudgeRate(dir) { const r = settings.rate; const step = (dir > 0 ? r < 2 : r <= 2) ? 0.05 : 0.25; setRate(snapRate(r + dir * step)); }
function setRate(r, silent) {
  settings.rate = Math.round(clamp(r, 1, 5) * 100) / 100; saveSettings();
  const cap = $('#cap'), val = $('#rateVal'), knob = $('#knob'); if (!cap) return;
  cap.style.transform = `rotate(${rateToAngle(settings.rate)}deg)`;
  val.textContent = settings.rate.toFixed(2) + '×';
  knob.setAttribute('aria-valuenow', settings.rate);
  if (!silent && tts.utter) { /* rate changes apply from the next sentence */ }
}
function bindKnob() {
  const knob = $('#knob'); let dragging = false, lastAngle = 0;
  const angleOf = (e) => { const r = knob.getBoundingClientRect(); return Math.atan2(e.clientY - (r.top + r.height / 2), e.clientX - (r.left + r.width / 2)) * 180 / Math.PI; };
  knob.addEventListener('pointerdown', (e) => { dragging = true; lastAngle = angleOf(e); knob.setPointerCapture(e.pointerId); });
  knob.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    const a = angleOf(e); let d = a - lastAngle; if (d > 180) d -= 360; if (d < -180) d += 360; lastAngle = a;
    setRate(posToRate(clamp(rateToPos(settings.rate) + d / 270, 0, 1)));
  });
  ['pointerup', 'pointercancel'].forEach((ev) => knob.addEventListener(ev, () => { dragging = false; setRate(snapRate(settings.rate)); }));
  knob.addEventListener('wheel', (e) => { e.preventDefault(); nudgeRate(e.deltaY < 0 ? 1 : -1); }, { passive: false });
  knob.addEventListener('keydown', (e) => { if (e.key === 'ArrowUp' || e.key === 'ArrowRight') { e.preventDefault(); e.stopPropagation(); nudgeRate(1); } if (e.key === 'ArrowDown' || e.key === 'ArrowLeft') { e.preventDefault(); e.stopPropagation(); nudgeRate(-1); } });
}

/* ---------------- settings sheet ---------------- */
function openSheet() { sheetOpen = true; const bg = $('#sheetBg'), sh = $('#sheet'); bg.hidden = sh.hidden = false; renderSheet(); requestAnimationFrame(() => { bg.classList.add('open'); sh.classList.add('open'); }); }
function closeSheet(now) {
  sheetOpen = false; state.learning = null;
  const bg = $('#sheetBg'), sh = $('#sheet'); if (!bg) return;
  bg.classList.remove('open'); sh.classList.remove('open');
  const hide = () => { bg.hidden = sh.hidden = true; };

  const st = $('#stage'); if (st) st.focus({ preventScroll: true });
}

  const sh = $('#sheet'); if (!sh) return;

  const km = settings.keymap;
  const keyRow = (id, label) => `<div class="keymap-row"><span>${label}</span><div class="keys">${km[id].length ? km[id].map((k) => `<span class="k"><span class="key">${esc(keyName(k))}</span><button data-unkey="${id}:${esc(k)}" aria-label="${esc(keyName(k))} 삭제">×</button></span>`).join('') : '<span class="empty-keys">연결된 버튼 없음</span>'}</div>
    ${state.learning === id ? '<span class="learn-note">버튼을 누르세요…</span>' : `<button class="btn small" data-learn="${id}">배우기</button>`}</div>`;
  sh.innerHTML = `
    <div class="grip"></div>
    <h2>음성</h2>
    <div class="seg" role="radiogroup" aria-label="음성 소스">
      <button role="radio" aria-checked="${settings.voiceSource === 'mine'}" data-src="mine">${ICON.mic}내 목소리</button>
      <button role="radio" aria-checked="${settings.voiceSource === 'tts'}" data-src="tts">${ICON.speaker}기기 음성</button>
    </div>
    <p class="hint">${recs.size ? `${recs.size}/${current().sentences.length}문장에 녹음이 있습니다. 녹음이 없는 문장은 기기 음성으로 읽습니다.` : '아직 녹음이 없습니다. 편집 화면의 "내 목소리 녹음"에서 문장을 녹음하세요.'}</p>
    <div class="setting"><div class="label">기기 음성 목소리<small>${voices.length ? `${ko.length}개 한국어 음성` : '음성 목록을 불러오는 중'}</small></div></div>
    <div class="select-wrap"><select class="field" id="voice">${ko.map(opt).join('')}${others.length ? '<optgroup label="다른 언어">' + others.map(opt).join('') + '</optgroup>' : ''}</select></div>
    <div class="setting" style="margin-top:6px"><div class="label">미리 듣기<small>현재 속도 ${settings.rate}×</small></div><button class="btn small" id="testVoice">${ICON.speaker}테스트</button></div>
    <h2>화면</h2>
    <div class="setting"><div class="label">보이는 문장 수<small>현재 문장을 가운데 두고 앞뒤 문장을 함께 보여줍니다</small></div>
      <div class="seg mini" role="radiogroup">${[1, 3, 5].map((v) => `<button role="radio" aria-checked="${(settings.stack || 5) === v}" data-stack="${v}">${v}</button>`).join('')}</div></div>
    <h2>자동 진행</h2>
    <div class="setting"><div class="label">다음 문장 시작 시점<small>내 말이 끝나기 몇 초 전에 다음 문장을 들려줄지</small></div>
      <div class="stepper"><button class="btn" id="leadDown">−</button><span class="val" id="leadVal">${settings.lead.toFixed(1)}s</span><button class="btn" id="leadUp">+</button></div></div>
    <p class="hint">읽어준 시간과 속도로 실제 말하는 시간을 추정합니다. 몇 문장 지나면 더 정확해집니다.</p>
    <h2>리모컨 버튼</h2>
    ${keyRow('next', '다음')}${keyRow('prev', '이전')}${keyRow('play', '읽기')}
    <p class="hint" style="margin-top:8px">리모컨을 휴대폰 블루투스에 연결한 뒤 버튼을 눌러 보세요. 키보드(PPT), 마우스 클릭, 휠, 음악 키(다음곡·이전곡·재생), 화면 쓸기·탭(쇼츠 모드 링 리모컨), 게임패드 신호를 모두 받습니다. 링 리모컨은 기본값으로 위로 쓸기 = 다음, 아래로 쓸기 = 이전, 가운데 탭 = 읽기입니다. 길게 누르기(볼륨·화면 잠금)는 브라우저가 받지 못합니다. 음악 키는 발표 화면을 한 번 터치한 뒤부터 잡힙니다. 아래에 아무것도 안 찍히면 리모컨의 모드를 바꿔 보세요.</p>
    <div class="row between" style="margin-top:8px"><span class="eyebrow">받은 신호</span><button class="btn ghost small" id="resetKeys">기본값으로</button></div>
    <div class="sig-mon" id="sigMon">${signalMonitor()}</div>
    <div class="row" style="margin-top:18px"><button class="btn lamp grow" id="closeSheet">닫기</button></div>`;
  $('#voice').onchange = (e) => { settings.voiceURI = e.target.value; saveSettings(); };
  sh.querySelectorAll('[data-src]').forEach((b) => b.onclick = () => { settings.voiceSource = b.dataset.src; saveSettings(); renderSheet(); });
  $('#testVoice').onclick = () => tts.speak('안녕하세요. 이 속도로 대본을 읽어 드립니다.');
  $('#leadDown').onclick = () => { settings.lead = clamp(settings.lead - 0.5, 0, 10); saveSettings(); $('#leadVal').textContent = settings.lead.toFixed(1) + 's'; $('#leadLbl').textContent = settings.lead; };
  $('#leadUp').onclick = () => { settings.lead = clamp(settings.lead + 0.5, 0, 10); saveSettings(); $('#leadVal').textContent = settings.lead.toFixed(1) + 's'; $('#leadLbl').textContent = settings.lead; };
  sh.querySelectorAll('[data-stack]').forEach((b) => b.onclick = () => { settings.stack = +b.dataset.stack; saveSettings(); renderSheet(); updateCue(); });
  sh.querySelectorAll('[data-learn]').forEach((b) => b.onclick = () => { state.learning = b.dataset.learn; renderSheet(); });
  sh.querySelectorAll('[data-unkey]').forEach((b) => b.onclick = () => { const [id, k] = b.dataset.unkey.split(/:(.*)/); settings.keymap[id] = settings.keymap[id].filter((x) => x !== k); saveSettings(); renderSheet(); });
  $('#resetKeys').onclick = () => { settings.keymap = JSON.parse(JSON.stringify(DEFAULT_KEYMAP)); saveSettings(); renderSheet(); };
  $('#closeSheet').onclick = () => { closeSheet(); renderStage(); };
}

/* ---------------- keyboard / remote ----------------
   Presentation remotes reach the page as keyboard keys, but some Android builds hand over an empty key name
   or only a scroll gesture. Every input path is folded into one "signal" so the learn mode and the keymap
   can use whichever the remote actually sends. */
const KEYCODE_MAP = { 33: 'PageUp', 34: 'PageDown', 37: 'ArrowLeft', 38: 'ArrowUp', 39: 'ArrowRight', 40: 'ArrowDown', 32: ' ', 13: 'Enter', 27: 'Escape', 116: 'F5', 190: '.', 66: 'b', 9: 'Tab' };
function keyFromEvent(e) {
  let k = e.key;
  if (!k || k === 'Unidentified' || k === 'Dead' || k === 'Process') k = KEYCODE_MAP[e.keyCode] || e.code || '';

}
state.signals = [];
function logSignal(type, key, e) {
  state.signals.unshift({ type, key, code: e.code || (e.pointerType ? e.pointerType : ''), keyCode: e.keyCode || 0, t: Date.now() });
  state.signals.length = Math.min(state.signals.length, 6);
  const mon = $('#sigMon'); if (mon) mon.innerHTML = signalMonitor();
}
function signalMonitor() {
  if (!state.signals.length) return '<span class="dim">아직 받은 신호가 없습니다. 리모컨 버튼을 눌러 보세요. 키보드·휠·마우스 클릭·스크롤·게임패드 신호를 모두 표시합니다.</span>';
  return state.signals.map((x) => `<span class="sig"><span class="key">${esc(keyName(x.key) || '?')}</span><span class="dim">${x.type}${x.code ? ' · ' + esc(x.code) : ''}${x.keyCode ? ' · #' + x.keyCode : ''}</span></span>`).join('');
}
const ACTION_LABEL = { next: '다음', prev: '이전', play: '읽기' };
let lastKeyDownAt = 0;
function handleSignal(key, e) {
  if (!key) return;
  if (state.view !== 'stage' && state.view !== 'record') return;
  if (state.learning) {
    e.preventDefault();
    const id = state.learning; const km = settings.keymap;
    for (const k of Object.keys(km)) km[k] = km[k].filter((x) => x !== key);
    km[id].unshift(key); saveSettings(); state.lastKey = key; state.learning = null; renderSheet(); toast(`"${keyName(key)}" 버튼을 ${ACTION_LABEL[id]}에 연결했습니다`);
    return;
  }
  if (sheetOpen) { if (key === 'Escape') closeSheet(); return; }
  const tag = (e.target && e.target.tagName || '').toLowerCase(); if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
  const km = settings.keymap;
  const action = km.next.includes(key) ? 'next' : km.prev.includes(key) ? 'prev' : km.play.includes(key) ? 'play' : null;
  state.lastKey = key; flashKey(key, !!action);
  if (!action) return;
  e.preventDefault(); if (e.repeat) return;
  if (state.view === 'record') { flashButton({ next: 'rNext', prev: 'rPrev', play: 'rToggle' }[action]); if (action === 'play') toggleRecording(); else moveRecord(action === 'next' ? 1 : -1); return; }
  act(action);
}
window.addEventListener('keydown', (e) => { const k = keyFromEvent(e); lastKeyDownAt = performance.now(); logSignal('keydown', k, e); handleSignal(k, e); }, true);
window.addEventListener('keyup', (e) => {
  const k = keyFromEvent(e); logSignal('keyup', k, e);

  if (performance.now() - lastKeyDownAt > 600) handleSignal(k, e);
}, true);
let lastWheelAt = 0;
window.addEventListener('wheel', (e) => {
  if (state.view !== 'stage' && state.view !== 'record') return;
  const k = e.deltaY > 0 ? 'Wheel↓' : e.deltaY < 0 ? 'Wheel↑' : '';
  if (!k) return;
  const km = settings.keymap; const mapped = state.learning || km.next.includes(k) || km.prev.includes(k) || km.play.includes(k);
  if (!mapped) return;
  e.preventDefault();
  if (performance.now() - lastWheelAt < 400) return; // one press often arrives as several wheel ticks
  lastWheelAt = performance.now(); logSignal('wheel', k, e); handleSignal(k, e);
}, { passive: false, capture: true });
const isMapped = (k) => { const km = settings.keymap; return !!state.learning || km.next.includes(k) || km.prev.includes(k) || km.play.includes(k); };
/* Remotes in mouse mode: their buttons arrive as mouse clicks, which a phone's finger taps never are. */
window.addEventListener('pointerdown', (e) => {
  if (e.pointerType !== 'mouse') { lastTouchAt = performance.now(); return; }
  if (state.view !== 'stage' && state.view !== 'record') return;
  const k = 'Mouse' + e.button; logSignal('mouse', k, e);
  if (!isMapped(k)) return;
  if (!state.learning && e.target.closest('button,input,select,textarea,.knob,.sheet')) return; // real mouse use of the UI
  e.preventDefault(); handleSignal(k, e);
}, true);
window.addEventListener('touchstart', () => { lastTouchAt = performance.now(); }, { passive: true, capture: true });
/* Scrolling that no finger and no wheel caused: the system moved the page for the remote. */
let lastTouchAt = 0, lastScrollTop = new WeakMap(), lastScrollAt = 0;
window.addEventListener('scroll', (e) => {
  if (state.view !== 'stage' && state.view !== 'record') return;
  const el = e.target === document ? document.scrollingElement : e.target; if (!el) return;
  const top = el.scrollTop, prev = lastScrollTop.get(el); lastScrollTop.set(el, top);
  if (prev === undefined || top === prev) return;
  if (performance.now() - lastTouchAt < 900 || performance.now() - lastWheelAt < 300) return;
  const k = top > prev ? 'Scroll↓' : 'Scroll↑';
  if (performance.now() - lastScrollAt < 500) return; lastScrollAt = performance.now();
  logSignal('scroll', k, e);
  if (isMapped(k)) handleSignal(k, e);
}, true);
/* Remotes in "music" mode send media keys. Android hands those to whichever page holds an audio session,
   so a near-silent loop is kept playing while the stage is open (started on the first tap, as browsers require). */
const media = {
  el: null, ready: false,
  start() {
    if (this.ready || !('mediaSession' in navigator) || (state.view !== 'stage' && state.view !== 'record')) return;
    const a = new Audio(URL.createObjectURL(wavBlob(new Float32Array(4000), 8000))); a.loop = true; a.volume = 0.05; this.el = a;
    const acts = { nexttrack: 'Media:next', previoustrack: 'Media:prev', seekforward: 'Media:next', seekbackward: 'Media:prev', play: 'Media:play', pause: 'Media:play', stop: 'Media:play' };
    for (const [action, k] of Object.entries(acts)) {
      try { navigator.mediaSession.setActionHandler(action, () => { logSignal('media', k, { code: action }); handleSignal(k, { preventDefault() {}, target: document.body }); try { navigator.mediaSession.playbackState = 'playing'; } catch {} if (this.el && this.el.paused) this.el.play().catch(() => {}); }); } catch {}
    }
    a.play().then(() => { this.ready = true; try { navigator.mediaSession.metadata = new MediaMetadata({ title: '리모컨 대기 중', artist: 'EarCue 이어큐' }); navigator.mediaSession.playbackState = 'playing'; } catch {} renderStageStatus(); }).catch(() => {});
  },
  stop() { if (this.el) { this.el.pause(); this.el.removeAttribute('src'); this.el = null; } this.ready = false; try { for (const a of ['nexttrack', 'previoustrack', 'seekforward', 'seekbackward', 'play', 'pause', 'stop']) navigator.mediaSession.setActionHandler(a, null); } catch {} },
};
['pointerdown', 'keydown', 'touchstart'].forEach((ev) => window.addEventListener(ev, () => media.start(), { capture: true, passive: true }));
/* Remotes in "shorts" mode inject finger swipes. Touch events keep firing even when the page scrolls. */
let swipe = null;
window.addEventListener('touchstart', (e) => { const t = e.changedTouches[0]; swipe = { x: t.clientX, y: t.clientY, t: performance.now(), target: e.target }; }, { capture: true, passive: true });
let lastTapAt = 0;
const gestureAllowed = (start) => !!state.learning || (!start.target.closest('.knob, .sheet, .sheet-bg') && !sheetOpen); // a ring injects at the screen centre, wherever that lands
function judgeSwipe(dx, dy, e) {
  let k = '';
  if (Math.abs(dy) >= 35 && Math.abs(dx) <= Math.abs(dy) * 0.8) k = dy < 0 ? 'Swipe↑' : 'Swipe↓';
  else if (Math.abs(dx) >= 35 && Math.abs(dy) <= Math.abs(dx) * 0.8) k = dx < 0 ? 'Swipe←' : 'Swipe→';
  if (!k || !swipe || swipe.done) return false;
  swipe.done = true; logSignal('swipe', k, e);
  if (isMapped(k) && gestureAllowed(swipe)) handleSignal(k, { preventDefault() {}, target: swipe.target });
  return true;
}
// judged while the finger is still moving, so a remote's gesture reacts at once instead of on release
window.addEventListener('touchmove', (e) => {
  if (!swipe || swipe.done) return; const t = e.changedTouches[0]; swipe.lx = t.clientX; swipe.ly = t.clientY;
  if (state.view !== 'stage' && state.view !== 'record') return;
  if (performance.now() - swipe.t > 900) return;
  judgeSwipe(t.clientX - swipe.x, t.clientY - swipe.y, e);
}, { capture: true, passive: true });
function endTouch(e, cancelled) {
  if (!swipe) return; const t = e.changedTouches && e.changedTouches[0]; const start = swipe; swipe = null;
  const ex = t ? t.clientX : (start.lx ?? start.x), ey = t ? t.clientY : (start.ly ?? start.y);
  const dx = ex - start.x, dy = ey - start.y, dt = performance.now() - start.t;
  if (state.view !== 'stage' && state.view !== 'record') return;
  if (start.done) return;
  if (!cancelled && dt < 450 && Math.abs(dx) < 15 && Math.abs(dy) < 15) {
    // a short still touch is a tap; a ring's centre button usually injects one (or two) at the screen centre
    if (start.target.closest('button,input,select,textarea,a,.knob,.switch,.rocker,.seg')) return; // the app's own buttons keep their click behaviour
    const dbl = performance.now() - lastTapAt < 350; lastTapAt = dbl ? 0 : performance.now();
    const k = dbl ? 'DoubleTap' : 'Tap'; logSignal('tap', k, e);
    if (isMapped(k) && gestureAllowed(start)) handleSignal(k, { preventDefault() {}, target: start.target });
    return;
  }

}
window.addEventListener('touchend', (e) => endTouch(e, false), { capture: true, passive: true });
window.addEventListener('touchcancel', (e) => endTouch(e, true), { capture: true, passive: true });
/* Some remotes enumerate as a gamepad. */
const padState = {};
function pollGamepads() {
  if (state.view === 'stage' || state.view === 'record') {
    const pads = navigator.getGamepads ? navigator.getGamepads() : [];
    for (const g of pads) { if (!g) continue; g.buttons.forEach((b, i) => { const id = g.index + ':' + i; if (b.pressed && !padState[id]) { const k = 'Pad' + i; logSignal('gamepad', k, { code: g.id.slice(0, 24) }); if (isMapped(k)) handleSignal(k, { preventDefault() {}, target: document.body }); } padState[id] = b.pressed; }); }
  }
  setTimeout(pollGamepads, 80);

pollGamepads();
function flashKey(k, lit) { const el = $('#keyflash'); if (!el) return; el.textContent = keyName(k); el.classList.toggle('lit', lit); el.classList.remove('x'); clearTimeout(el._t); el._t = setTimeout(() => { el.classList.remove('lit'); }, 500); }

/* ---------------- misc ---------------- */
async function requestWakeLock() { try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch {} }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && state.view === 'stage' && !wakeLock) requestWakeLock(); });
let toastT = 0;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2400); }
window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); state.installPrompt = e; if (state.view === 'home') render(); });
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) { try { navigator.serviceWorker.register('sw.js').catch(() => {}); } catch {} }

route();
</script>
