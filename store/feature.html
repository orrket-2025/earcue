<!doctype html><html lang="ko"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;width:1024px;height:500px;overflow:hidden;font-family:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;color:#D9DCE1;
 background:radial-gradient(120% 80% at 50% -10%,rgba(255,255,255,.07),transparent 60%),linear-gradient(180deg,#3D424A,#2A2E34)}
.wrap{display:grid;grid-template-columns:1fr 340px;height:500px;align-items:center;padding:0 70px;box-sizing:border-box;gap:40px}
.brand b{display:block;font-size:64px;font-weight:600;letter-spacing:.18em;color:#ECE9E1;text-shadow:0 1px 0 rgba(255,255,255,.12),0 -1px 0 rgba(0,0,0,.5)}
.brand small{display:block;font-weight:300;font-size:18px;letter-spacing:.3em;color:#9DA2AA;margin-top:10px;padding-top:12px;border-top:1px solid rgba(0,0,0,.55);box-shadow:0 1px 0 rgba(255,255,255,.1) inset;width:max-content}
h1{font-size:30px;font-weight:500;margin:34px 0 10px;line-height:1.35}
p{font-size:17px;color:#9DA2AA;margin:0;line-height:1.6}
.card{border-radius:18px;padding:22px 24px;background:linear-gradient(180deg,#1C1F23,#24272C);box-shadow:inset 0 2px 5px rgba(0,0,0,.65),0 1px 0 rgba(255,255,255,.06)}
.line{display:grid;grid-template-columns:22px 1fr;gap:8px;align-items:baseline;padding:7px 0;font-size:16px;color:#6F757E}
.line .n{font-family:"IBM Plex Mono",monospace;font-size:11px;text-align:right}
.line.now{color:#5CFF9D;font-weight:500;text-shadow:0 0 14px rgba(92,255,157,.35)}
.line.now .n{color:#5CFF9D}
.line.after{color:#9DA2AA}
.track{margin-top:14px;height:10px;border-radius:5px;background:linear-gradient(180deg,#1C1F23,#24272C);box-shadow:inset 0 2px 5px rgba(0,0,0,.65);position:relative}
.track i{position:absolute;left:0;top:0;bottom:0;width:62%;border-radius:5px;background:linear-gradient(180deg,#FAFBFC,#C9CED6);box-shadow:0 0 12px rgba(241,243,246,.35)}
.tag{display:flex;align-items:center;gap:8px;font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.14em;color:#9DA2AA;margin-bottom:8px}
.led{width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#FF9D95,#FF5A4E 60%);box-shadow:0 0 8px rgba(255,90,78,.75)}
</style></head><body><div class="wrap">
<div><div class="brand"><b>EARCUE</b><small>이어큐 · 귓속 프롬프터</small></div>
<h1>대본을 외우지 마세요.<br>이어폰이 한 문장씩 미리 읽어줍니다.</h1>
<p>블루투스 리모컨으로 넘기고, 내 목소리로 듣고, 말이 끝나기 전에 다음 문장이 옵니다.</p></div>
<div class="card"><div class="tag"><i class="led"></i>지금 <span style="margin-left:auto">04 / 20</span></div>
<div class="line"><span class="n">3</span><span>오늘 발표는 세 부분으로 나뉩니다.</span></div>
<div class="line now"><span class="n">4</span><span>먼저 지난 분기 성과를 짧게 돌아보겠습니다.</span></div>
<div class="line after"><span class="n">5</span><span>월간 활성 사용자는 42만 명입니다.</span></div>
<div class="line"><span class="n">6</span><span>재방문율이 눈에 띄게 올랐습니다.</span></div>
<div class="track"><i></i></div></div>
</div></body></html>
