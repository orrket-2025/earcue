name: Build Android APK

on:
  push:
    branches: [main]
    paths: ['android/**', 'earcue/**', 'package.json', 'package-lock.json', 'capacitor.config.json', 'resources/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm ci
      - name: Copy web app into the Android project
        run: npx cap sync android
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk EarCue-debug.apk
      - uses: actions/upload-artifact@v4
        with: { name: EarCue-debug, path: EarCue-debug.apk }
      - name: Publish as the "android-latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: EarCue Android (최신 빌드)
          body: "폰에서 EarCue-debug.apk를 내려받아 설치하세요. 커밋 ${{ github.sha }}"
          files: EarCue-debug.apk
          prerelease: true
