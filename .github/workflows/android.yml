name: Build Android APK

on:
  push:
    branches: [main]
    paths: ['android/**', 'earcue/**', 'package.json', 'package-lock.json', 'capacitor.config.json', 'resources/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm ci
      - name: Copy web app into the Android project
        run: npx cap sync android
      - name: Version from the build number
        run: |
          echo "VERSION_CODE=${{ github.run_number }}" >> $GITHUB_ENV
          echo "VERSION_NAME=1.0.${{ github.run_number }}" >> $GITHUB_ENV
      - name: Restore the upload keystore (when the secrets are set)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/upload-keystore.p12
          echo "ANDROID_KEYSTORE_PATH=$GITHUB_WORKSPACE/android/upload-keystore.p12" >> $GITHUB_ENV
          echo "ANDROID_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
          echo "ANDROID_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> $GITHUB_ENV
          echo "ANDROID_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> $GITHUB_ENV
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Build signed release AAB and APK (Play Store)
        if: ${{ env.ANDROID_KEYSTORE_PATH != '' }}
        run: cd android && ./gradlew bundleRelease assembleRelease --no-daemon
      - name: Collect outputs
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk EarCue-debug.apk
          [ -f android/app/build/outputs/bundle/release/app-release.aab ] && cp android/app/build/outputs/bundle/release/app-release.aab EarCue-release.aab || true
          [ -f android/app/build/outputs/apk/release/app-release.apk ] && cp android/app/build/outputs/apk/release/app-release.apk EarCue-release.apk || true
          ls -la EarCue-*
      - uses: actions/upload-artifact@v4
        with: { name: EarCue-builds, path: "EarCue-*" }
      - name: Publish as the "android-latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: EarCue Android 1.0.${{ github.run_number }}
          body: |
            - 테스트 설치: EarCue-debug.apk
            - Play 스토어 업로드용: EarCue-release.aab (서명 키 시크릿이 등록된 경우에만 생성)
            - 커밋 ${{ github.sha }}
          files: "EarCue-*"
          prerelease: true
